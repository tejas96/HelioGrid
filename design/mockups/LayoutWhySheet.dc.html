<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/colors.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/fonts.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/typography.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/styles.css">
<script src="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/_ds_bundle.js"></script>
</helmet>
<div style="font-family:var(--font-sans); color:var(--text-primary)">
  <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px">Why this layout?</div>
  <div style="font-size:12px; color:var(--text-secondary); margin-bottom:14px">What the auto-design chose, and where it can improve.</div>
  <div style="font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:8px">Decision log</div>
  <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:18px"><sc-for list="{{ log }}" as="d" hint-placeholder-count="3"><div style="padding:12px 14px; border-radius:14px; background:var(--surface-alt)"><div style="font-size:13px; font-weight:600">{{ d.title }}</div><div style="margin-top:3px; font-size:11.5px; color:var(--text-secondary); line-height:1.5">{{ d.reason }}</div></div></sc-for></div>
  <div style="font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:8px">Suggestions</div>
  <div style="display:flex; flex-direction:column; gap:8px"><sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="2"><div style="padding:12px 14px; border-radius:14px; background:var(--accent-subtle)"><div style="font-size:12.5px; font-weight:600; color:var(--accent-hover)">{{ s.title }}</div><div style="margin-top:2px; font-size:11.5px; color:var(--text-secondary); line-height:1.45">{{ s.detail }}</div><div style="display:flex; gap:8px; margin-top:10px"><button onClick="{{ noop }}" style="{{ acceptBtn }}">Accept</button><button onClick="{{ noop }}" style="{{ ignoreBtn }}">Ignore</button></div></div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360}}">
class Component extends DCLogic {
  renderVals() {
    return {
      noop: () => {},
      log: [
        { title: 'Portrait orientation', reason: 'Portrait fit one more column within the setbacks than landscape on this roof plane.' },
        { title: '3 strings of 4', reason: 'Balances the two MPPTs of the Sungrow SG10RS and keeps cold-weather voltage inside the window.' },
        { title: 'Skipped the SE corner', reason: 'The water tank (WT1) and its setback would shade the lowest row in winter.' },
      ],
      suggestions: [
        { title: 'Rotate Table A to due south', detail: 'The array faces SSW (202°). Rotating to south lifts annual yield ~4%.' },
        { title: 'Add a 4th row', detail: 'There is room for one more row after the walkway — +4 panels, ~1.1 kWp.' },
      ],
      acceptBtn: { height: 32, padding: '0 14px', borderRadius: 999, border: 'none', cursor: 'pointer', background: 'var(--action-primary)', color: '#fff', fontFamily: 'inherit', fontSize: 12, fontWeight: 500 },
      ignoreBtn: { height: 32, padding: '0 14px', borderRadius: 999, border: 'none', cursor: 'pointer', background: 'var(--surface)', boxShadow: 'var(--e1)', color: 'var(--text-secondary)', fontFamily: 'inherit', fontSize: 12, fontWeight: 500 },
    };
  }
}
</script>
</body>
</html>
