<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/colors.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/fonts.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/typography.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/styles.css">
<script src="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/_ds_bundle.js"></script>
</helmet>
<div style="font-family:var(--font-sans); color:var(--text-primary)">
  <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; margin-bottom:14px">More grow options</div>
  <div style="font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:8px">Axis</div>
  <div style="display:flex; gap:8px; margin-bottom:16px"><button onClick="{{ setRow }}" style="{{ rowStyle }}">Row</button><button onClick="{{ setCol }}" style="{{ colStyle }}">Column</button></div>
  <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px"><span style="font-size:12px; font-weight:500; color:var(--text-secondary)">Count</span><span style="font-family:var(--font-mono); font-size:13px; color:var(--accent)">{{ count }}</span></div>
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px"><button onClick="{{ minus }}" style="{{ stepBtn }}">−</button><input type="range" min="1" max="20" value="{{ count }}" onInput="{{ setCount }}" style="flex:1; height:5px; accent-color:var(--accent); cursor:pointer"><button onClick="{{ plus }}" style="{{ stepBtn }}">+</button></div>
  <div style="font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:8px">Grow from</div>
  <div style="display:flex; gap:8px; margin-bottom:16px"><button onClick="{{ setStart }}" style="{{ startStyle }}">{{ sideA }}</button><button onClick="{{ setEnd }}" style="{{ endStyle }}">{{ sideB }}</button></div>
  <div style="padding:14px; border-radius:14px; background:var(--surface-alt); margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:4px"><sc-for list="{{ preview }}" as="p" hint-placeholder-count="16"><span style="{{ p.style }}"></span></sc-for></div>
  <button onClick="{{ add }}" style="{{ addBtn }}">Add {{ count }} panels</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400},&quot;close&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { axis: 'row', count: 3, from: 'end' };
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ flex: 1, height: 42, borderRadius: 12, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 500, background: on ? 'var(--action-primary)' : 'var(--neutral-bg)', color: on ? '#fff' : 'var(--text-secondary)' });
    const side = (on) => ({ flex: 1, height: 40, borderRadius: 12, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12.5, fontWeight: 500, background: on ? 'var(--accent-subtle)' : 'var(--surface-alt)', color: on ? 'var(--accent-hover)' : 'var(--text-primary)', outline: on ? '1.5px solid var(--accent)' : 'none', outlineOffset: -1.5 });
    const base = 12; const preview = [];
    for (let i = 0; i < base + s.count; i++) preview.push({ style: { width: 12, height: 18, borderRadius: 2, background: i < base ? 'rgba(60,70,120,0.7)' : 'var(--accent)' } });
    return {
      count: s.count,
      setRow: () => this.setState({ axis: 'row' }), setCol: () => this.setState({ axis: 'col' }),
      rowStyle: seg(s.axis === 'row'), colStyle: seg(s.axis === 'col'),
      setCount: (e) => this.setState({ count: +e.target.value }), minus: () => this.setState(p => ({ count: Math.max(1, p.count - 1) })), plus: () => this.setState(p => ({ count: Math.min(20, p.count + 1) })),
      sideA: s.axis === 'row' ? 'Top' : 'Left', sideB: s.axis === 'row' ? 'Bottom' : 'Right',
      setStart: () => this.setState({ from: 'start' }), setEnd: () => this.setState({ from: 'end' }),
      startStyle: side(s.from === 'start'), endStyle: side(s.from === 'end'),
      preview,
      stepBtn: { width: 44, height: 44, borderRadius: 12, border: 'none', cursor: 'pointer', background: 'var(--surface-alt)', boxShadow: 'var(--e1)', fontFamily: 'var(--font-mono)', fontSize: 18, fontWeight: 700, color: 'var(--text-primary)' },
      addBtn: { width: '100%', height: 48, borderRadius: 999, border: 'none', cursor: 'pointer', background: 'var(--action-primary)', color: '#fff', fontFamily: 'inherit', fontSize: 14, fontWeight: 500 },
      add: this.props.close || (() => {}),
    };
  }
}
</script>
</body>
</html>
