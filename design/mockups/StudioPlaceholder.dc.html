<style>
  @keyframes hg-bloom { 0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.85 } 50%{ transform:translate(-50%,-50%) scale(1.08); opacity:1 } }
  a{ color:var(--link); text-decoration:none } a:hover{ color:var(--link-hover) }
  @media (prefers-reduced-motion: reduce){ .hg-bloom-layer{ animation:none !important } }
</style>
</helmet>
<div style="min-width:100%; min-height:600px; box-sizing:border-box; background:var(--canvas); font-family:var(--font-sans); color:var(--text-primary); display:flex; align-items:center; justify-content:center; padding:80px 40px">
  <div style="position:relative; max-width:560px; text-align:center">
    <div class="hg-bloom-layer" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:520px; height:520px; background:var(--glow-brand); pointer-events:none; animation:hg-bloom 8s var(--ease-standard) infinite"></div>
    <div style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:center">
      <div style="width:76px; height:76px; border-radius:50%; background:var(--surface); box-shadow:var(--e2); display:flex; align-items:center; justify-content:center; color:var(--accent)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></div>
      <div style="margin-top:12px; display:inline-flex; align-items:center; height:24px; padding:0 12px; border-radius:999px; background:var(--surface-alt); color:var(--text-secondary); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase">Phase 10 · deferred (D23)</div>
      <h1 style="margin:18px 0 0; font-size:28px; font-weight:700; letter-spacing:-0.025em">The design studio isn't built yet</h1>
      <p style="margin:12px 0 0; font-size:15px; line-height:1.6; color:var(--text-secondary); text-wrap:pretty">Designs, the engineer sign-off queue and the returned-design review live in the studio — Phase 10, deferred for now. This notification will open the returned design here once the studio ships.</p>
      <button onClick="{{ goBack }}" style="margin-top:26px; height:46px; padding:0 22px; border-radius:999px; border:none; cursor:pointer; background:var(--action-primary); color:#fff; font-family:inherit; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Back to notifications</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { goBack: () => { window.location.href = 'NotificationsCentre.dc.html'; } };
  }
}
</script>
</body>
</html>
