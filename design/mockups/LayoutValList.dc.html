<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/colors.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/fonts.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/typography.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/styles.css">
<script src="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/_ds_bundle.js"></script>
</helmet>
<div style="font-family:var(--font-sans); color:var(--text-primary)">
  <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px">Validation</div>
  <div style="font-size:12px; color:var(--text-secondary); margin-bottom:12px">2 errors · 1 warning. Tap any item to locate the panels at fault.</div>
  <div style="display:flex; align-items:flex-start; gap:9px; padding:11px 13px; border-radius:14px; background:var(--danger-bg); margin-bottom:14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span style="font-size:12px; color:var(--text-primary); line-height:1.45">The next step is blocked while the electrical design is invalid.</span></div>
  <div style="display:flex; flex-direction:column; gap:8px">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="3"><div style="{{ i.rowStyle }}"><div style="display:flex; align-items:flex-start; gap:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ i.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4M12 17h.01"></path></svg><div style="flex:1"><div style="font-size:13px; font-weight:600">{{ i.title }}</div><div style="margin-top:2px; font-size:11.5px; color:var(--text-secondary); line-height:1.45">{{ i.detail }}</div></div></div><div style="display:flex; gap:8px; margin-top:10px"><button onClick="{{ locate }}" style="{{ locateBtn }}">Locate</button><sc-if value="{{ i.canAuto }}" hint-placeholder-val="{{ false }}"><button onClick="{{ autostring }}" style="{{ autoBtn }}">Auto-string now</button></sc-if></div></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400},&quot;locate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;autostring&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const row = { padding: '12px 14px', borderRadius: 14, background: 'var(--surface-alt)', boxShadow: 'var(--e1)' };
    return {
      items: [
        { title: 'String B voltage too high in cold', detail: 'Cold-weather Voc 1042 V exceeds the 1000 V system limit. Shorten the string.', color: 'var(--danger)', canAuto: true, rowStyle: row },
        { title: 'Panels left unstrung', detail: '3 panels are not part of any string and will not produce.', color: 'var(--danger)', canAuto: true, rowStyle: row },
        { title: 'DC/AC ratio slightly high', detail: 'Ratio 1.38 is above the healthy band (0.90–1.35). Consider a larger inverter.', color: 'var(--warning)', canAuto: false, rowStyle: row },
      ],
      locate: this.props.locate || (() => {}), autostring: this.props.autostring || (() => {}),
      locateBtn: { height: 34, padding: '0 14px', borderRadius: 999, border: 'none', cursor: 'pointer', background: 'var(--neutral-bg)', color: 'var(--text-primary)', fontFamily: 'inherit', fontSize: 12, fontWeight: 500 },
      autoBtn: { height: 34, padding: '0 14px', borderRadius: 999, border: 'none', cursor: 'pointer', background: 'var(--accent-subtle)', color: 'var(--accent-hover)', fontFamily: 'inherit', fontSize: 12, fontWeight: 600 },
    };
  }
}
</script>
</body>
</html>
