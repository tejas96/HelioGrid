<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/colors.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/fonts.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/tokens/typography.css">
<link rel="stylesheet" href="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/styles.css">
<script src="_ds/heliogrid-design-system-c8aa4326-21bf-453a-8d11-749cc81dee12/_ds_bundle.js"></script>
</helmet>
<div style="font-family:var(--font-sans); color:var(--text-primary)">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px"><div style="font-size:16px; font-weight:700; letter-spacing:-0.02em">6 panels selected</div><sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}"><span style="{{ lockChip }}">Locked</span></sc-if></div>
  <div style="font-size:12px; color:var(--text-secondary); margin-bottom:14px">Table A · rows 1–2 · azimuth 178° S</div>
  <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}"><div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:10px 12px; border-radius:12px; background:var(--warning-bg)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span style="font-size:11.5px; color:var(--text-primary)">Unlock the layout to edit these panels.</span></div></sc-if>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px"><sc-for list="{{ actions }}" as="a" hint-placeholder-count="8"><button style="{{ a.style }}"><span style="{{ a.icoStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.icon }}"></path></svg></span><span style="font-size:12.5px; font-weight:500">{{ a.label }}</span></button></sc-for></div>
  <div style="margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--surface-alt); font-size:11.5px; color:var(--text-secondary); line-height:1.5">Rotate shows the current azimuth (or "mixed"); tilt steps in 5°. Table settings open when a full table is selected.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const locked = this.props.locked;
    const defs = [
      ['Group', 'M3 3h8v8H3zM13 13h8v8h-8zM13 3h8v8h-8zM3 13h8v8H3z'],
      ['Grow row', 'M3 12h18M12 3v18M8 8l4-4 4 4'],
      ['Grow column', 'M3 12h18M12 3v18M16 8l4 4-4 4'],
      ['More grow', 'M12 5v14M5 12h14'],
      ['Rotate 90°', 'M21 2v6h-6M21 8A9 9 0 1 0 23 13'],
      ['Tilt', 'M3 18 21 6M3 18h18'],
      ['Enable', 'M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10'],
      ['Delete', 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6'],
    ];
    return {
      locked,
      lockChip: { display: 'inline-flex', alignItems: 'center', height: 22, padding: '0 9px', borderRadius: 999, background: 'var(--neutral-bg)', color: 'var(--text-secondary)', fontSize: 11, fontWeight: 600 },
      actions: defs.map(([label, icon]) => ({ label, icon,
        style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '14px 6px', borderRadius: 14, border: 'none', background: 'var(--surface-alt)', cursor: locked ? 'not-allowed' : 'pointer', fontFamily: 'inherit', color: locked ? 'var(--text-disabled)' : 'var(--text-primary)', opacity: locked ? 0.6 : 1 },
        icoStyle: { width: 34, height: 34, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: label === 'Delete' ? 'var(--danger-bg)' : 'var(--accent-subtle)', color: label === 'Delete' ? 'var(--danger)' : 'var(--accent)' } })),
    };
  }
}
</script>
</body>
</html>
