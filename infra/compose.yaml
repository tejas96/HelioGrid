# The local stack. ONE Postgres container serves the app AND Temporal — one container, one
# named volume, one port, and one managed Postgres bill in production. Splitting Temporal's two
# databases onto their own instance later is a connection-string change in
# temporal/config/temporal.yaml; no code change.
#
#   pnpm infra:up      from a clean clone, brings up everything
#   pnpm infra:down    stop, keep the data
#   pnpm infra:reset   down -v — destroys the volume
#
# Images are pinned BY DIGEST. A tag is a moving pointer, and a stack that cannot be re-fetched
# byte-for-byte is not reproducible.

name: heliogrid

# Compose's own include, not a script (CLAUDE.md §1: no new script). It merges the Temporal
# stack into THIS project, so one `up` / `down` / `down -v` covers everything.
#
# Relative paths inside the included file resolve against ITS directory, so `./config` and
# `./pki` there still mean infra/temporal/config and infra/temporal/pki.
include:
  - path: temporal/compose.yaml

services:
  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    # infra/temporal/ and infra/README.md name this container. Renaming it means editing each.
    container_name: heliogrid-pg-local
    environment:
      POSTGRES_USER: heliogrid
      POSTGRES_PASSWORD: heliogrid
      POSTGRES_DB: heliogrid_dev
    # Loopback ONLY. A bare '5544:5432' binds 0.0.0.0, which puts a superuser whose
    # password is in this file on every network the machine joins. Containers reach
    # postgres by service name on the project network, so nothing needs the wider bind.
    ports: ['127.0.0.1:5544:5432']
    volumes:
      # NAMED, never anonymous. The container this replaces used an anonymous volume, so
      # `docker rm` lost the database with no way to rebuild it. That is the bug being fixed.
      - 'heliogrid-pgdata:/var/lib/postgresql/data'
      # Runs ONCE, when the data directory is empty. This is what makes the database
      # reproducible: roles and databases are provisioned from the repo, not by hand.
      - './postgres/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heliogrid -d heliogrid_dev']
      interval: 3s
      timeout: 3s
      retries: 30

  # The object store every file's bytes live in locally (T-FPLAT-035). RustFS speaks the S3 API
  # the api's one adapter speaks, so the same code reaches the production vendor with other
  # settings. MinIO no longer publishes images. The credentials are development values and the
  # bind is loopback only; a browser uploads to it directly, so it listens on the host.
  object-store:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: heliogrid-object-store-local
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: heliogrid
      RUSTFS_SECRET_KEY: heliogrid-local-secret
    ports: ['127.0.0.1:9000:9000']
    volumes:
      - 'heliogrid-objects:/data'

  # Creates the files bucket once the store answers, then exits: a signed PUT with curl's own
  # SigV4, so no S3 client image is needed. 200 made it and 409 means it already exists — both
  # done, so a second `infra:up` is a no-op; anything else is retried for thirty seconds.
  object-store-bucket:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on: [object-store]
    # The store's development credentials, passed as settings rather than written on the command.
    environment:
      STORE_ACCESS_KEY: heliogrid
      STORE_SECRET_KEY: heliogrid-local-secret
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf 'machine object-store login %s password %s\n' "$$STORE_ACCESS_KEY" "$$STORE_SECRET_KEY"
        > /tmp/store.netrc;
        for attempt in $$(seq 1 30); do
        code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3'
        --netrc-file /tmp/store.netrc -X PUT http://object-store:9000/heliogrid-files-local);
        case $$code in 200|409) echo "bucket ready ($$code)"; exit 0;; esac; sleep 1;
        done; echo "the object store never answered"; exit 1

volumes:
  heliogrid-pgdata:
  heliogrid-objects:
