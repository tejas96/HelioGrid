name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality (lint · typecheck · test · build · openapi)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heliogrid
          POSTGRES_PASSWORD: heliogrid
          POSTGRES_DB: heliogrid_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heliogrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://heliogrid:heliogrid@localhost:5432/heliogrid_ci
      DATABASE_ADMIN_URL: postgres://heliogrid:heliogrid@localhost:5432/heliogrid_ci
      # BETTER_AUTH_SECRET was required here until 2026-08-01 (ADR-0024) — apps/api's env
      # schema no longer declares it, and Turborepo strict env mode would flag an undeclared
      # variable. The rebuild re-adds both the variable and the CI value together.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Migrations are append-only (packages/db/CLAUDE.md)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          if ! git diff --diff-filter=MDR --no-renames --quiet origin/${{ github.base_ref }}...HEAD -- packages/db/migrations; then
            echo "::error::An APPLIED migration was modified, deleted or RENAMED. Migrations are"
            echo "::error::append-only and sha256-locked by the runner — editing one makes"
            echo "::error::the db migrate step refuse to run. Add a new file instead."
            git diff --diff-filter=MDR --no-renames --name-only origin/${{ github.base_ref }}...HEAD -- packages/db/migrations
            exit 1
          fi
          echo "migrations append-only: OK"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BUILD FIRST. dependency-cruiser resolves a workspace import through the target's
      # `main`/`types`, which point at dist/ — so before anything is built the edge does not
      # exist and every rule aimed at a dist-shipping package reports clean. Proven
      # 2026-07-31: `db-access-in-repositories-only` fires with dist present and reports
      # "no dependency violations found" without it, on the identical offending file.
      - run: pnpm turbo build
      - run: pnpm turbo lint
      - name: Package boundaries (turbo tags — docs/17 Law 2)
        run: pnpm boundaries
      - run: pnpm turbo typecheck
      - name: Apply migrations (CI database)
        run: pnpm --filter @heliogrid/db migrate
      # The Better Auth migration step was removed on 2026-08-01 with the auth teardown
      # (ADR-0024) — the script it ran no longer exists. It created the tables the tenancy
      # scan vets, so when auth is rebuilt this step comes BACK: without it the scan only
      # warns that they are absent and never inspects them in CI at all.
      - run: pnpm turbo test

      - run: pnpm turbo build
      - name: OpenAPI freshness (committed spec matches the contract)
        # Same script as `pnpm check:openapi` so CI and local can never diverge on what
        # "fresh" means. oasdiff is absent here, so the breaking-change half skips cleanly
        # and only the freshness half gates the merge.
        run: pnpm check:openapi
      - name: i18n extract guard (unextracted messages never merge — docs/10 §7.2)
        run: |
          pnpm --filter @heliogrid/i18n extract
          git diff --exit-code packages/i18n/src/locales
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: packages/contracts/openapi/openapi.json

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='@heliogrid/mobile^...'
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Bundle the RN JavaScript (Law 7's only proof that the JS resolves)
        working-directory: apps/mobile
        # `assembleDebug` does NOT bundle JS — a debug build loads it from Metro at runtime —
        # and the iOS job builds Debug too. So until this step nothing mechanical proved the
        # React Native JavaScript even resolves: a broken import path, a renamed asset, a Metro
        # resolution failure of a workspace package, or a package-exports change in a dependency
        # all passed CI green. typecheck does not catch these — the bundler is the only thing
        # that walks the real module graph the app runs on.
        shell: bash
        run: pnpm bundle

  ios:
    name: ios (simulator build, macOS lane)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='@heliogrid/mobile^...'
      - name: Pod install
        working-directory: apps/mobile/ios
        run: |
          bundle install || sudo gem install cocoapods
          pod install
      - name: Build for simulator (no signing)
        working-directory: apps/mobile/ios
        # `shell: bash` turns on `-o pipefail`. Without it the step's exit status is
        # `tail`'s (always 0), so a Swift compile error, a missing Pod or a bad Info.plist
        # produced a GREEN job — the only mechanical proof the RN app still builds for iOS
        # (Law 7) could never fail.
        shell: bash
        run: |
          xcodebuild -workspace HelioGridMobile.xcworkspace \
            -scheme HelioGridMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50
