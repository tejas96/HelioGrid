name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token reads the repository and nothing else. A step that needs more declares it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Which lanes this change can reach. `quality` never asks; it always runs. The three mobile
  # lanes ask, because a native build costs 11–15 minutes and proves nothing about a change
  # that no mobile bundle contains. Markdown never counts: a CLAUDE.md inside apps/mobile is
  # not a mobile change (the same rule /qa applies to the surfaces a change reaches).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mobile_js: ${{ steps.lanes.outputs.mobile_js }}
      android: ${{ steps.lanes.outputs.android }}
      ios: ${{ steps.lanes.outputs.ios }}
      e2e_web: ${{ steps.lanes.outputs.e2e_web }}
      phone_e2e: ${{ steps.lanes.outputs.phone_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: lanes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:-HEAD}"
          # A pull request diffs against the merge base with its target; a push diffs against the
          # tip it replaced. No usable base (a first push, a force-push, a rewritten tip) means
          # every lane runs — unknown is never treated as "nothing changed".
          range=''
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            range="origin/${BASE_REF}...${sha}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${sha}"
          fi
          if [ -z "$range" ]; then
            echo 'no base to diff against — every lane runs'
            files=''; all=true
          else
            files=$(git diff --name-only "$range" | grep -vE '\.md$' || true)
            all=false
            printf 'changed (markdown dropped):\n%s\n' "${files:-<none>}"
          fi
          lane() { # lane <output> <path regex>
            local on=false
            if [ "$all" = true ] || printf '%s\n' "$files" | grep -qE "$2"; then on=true; fi
            echo "$1=$on" >> "$GITHUB_OUTPUT"
            echo "$1: $on"
          }
          # Everything Metro bundles: the app and every package apps/mobile may import
          # (turbo.json boundaries, app-mobile), plus the files that shape the module graph.
          lane mobile_js '^(apps/mobile/|packages/(config|contracts|data|domain|env|forms|i18n|theme|ui)/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|\.github/workflows/ci\.yml$)'
          # A native build changes only through native sources, the app manifest, the mobile
          # package.json (autolinking) or the lockfile (a native dependency's version).
          lane android '^(apps/mobile/(android/|package\.json$|app\.json$|react-native\.config\.js$)|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'
          lane ios '^(apps/mobile/(ios/|package\.json$|app\.json$|react-native\.config\.js$|Gemfile$|Gemfile\.lock$)|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'
          # The web regression suite: what the web and the api serve, every package either imports,
          # the suite itself, and the files that shape the build.
          lane e2e_web '^(apps/(web|api)/|packages/|tests/e2e/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|tsconfig\.base\.json$|\.github/workflows/ci\.yml$)'
          # The phone flows: what the app and the api run, every package either imports, the
          # database roles the api connects as, the phone suite and what it reads, and the build files.
          lane phone_e2e '^(apps/(mobile|api)/|packages/|infra/postgres/|tests/e2e/(mobile/|support/|package\.json$)|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|tsconfig\.base\.json$|\.github/workflows/ci\.yml$)'

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # The digest infra/compose.yaml pins, so the gate lane and a developer's
        # machine run one database rather than whatever the tag points at today.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: heliogrid
          POSTGRES_PASSWORD: heliogrid
          POSTGRES_DB: heliogrid_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heliogrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The lane connects as the roles production connects as (infra/postgres/init/01-roles.sql):
      # app_runtime is neither superuser nor BYPASSRLS, so row-level security is REAL here and the
      # api's boot-time precondition passes rather than being skipped; app_admin migrates and seeds.
      # The container's own superuser is used ONCE, by the step that creates those roles.
      DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/heliogrid_ci
      DATABASE_ADMIN_URL: postgres://app_admin:app_admin@localhost:5432/heliogrid_ci
      # The api's boot validates every key; none of these reaches a socket or a file unless a
      # workflow is started, which no test in this lane does (the channel opens on first use).
      TEMPORAL_ADDRESS: 127.0.0.1:1
      TEMPORAL_NAMESPACE: heliogrid
      TEMPORAL_TLS_CA_FILE: /dev/null
      TEMPORAL_TLS_CERT_FILE: /dev/null
      TEMPORAL_TLS_KEY_FILE: /dev/null
      TEMPORAL_AUTH_TOKEN_FILE: /dev/null
      # The development number whose code is fixed, so a test signs in through the front door.
      DEV_OTP_PHONES: "+919999999999"
      DEV_OTP_CODE: "000000"
      # A CI-only signing secret for the api's token; nothing outside this workflow ever
      # verifies a token signed with it. Declared in turbo.json's `env` list where a task reads it.
      AUTH_TOKEN_SECRET: ci-only-token-signing-secret-heliogrid-quality-lane-0001
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans every commit, and the openapi breaking-change compare
          # and the migration guard both read origin/<base>.
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Migrations are append-only (packages/db/CLAUDE.md)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          # Scoped to *.sql to match what the runner actually locks: migrate.ts reads
          # `readdirSync(...).filter(f => f.endsWith('.sql'))` and hashes only those, and
          # .claude/hooks/block-applied-migration-edit.sh matches only */migrations/*.sql.
          # Every .sql file is covered; nothing is exempted.
          if ! git diff --diff-filter=MDR --no-renames --quiet origin/${{ github.base_ref }}...HEAD -- 'packages/db/migrations/*.sql'; then
            echo "::error::An APPLIED migration was modified, deleted or RENAMED. Migrations are"
            echo "::error::append-only and sha256-locked by the runner — editing one makes"
            echo "::error::the db migrate step refuse to run. Add a new file instead."
            git diff --diff-filter=MDR --no-renames --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/db/migrations/*.sql'
            exit 1
          fi
          echo "migrations append-only: OK"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          # Keyed by JOB as well as commit. A cache key is write-once, so three ubuntu jobs
          # sharing one meant whichever finished first decided what the other two restored,
          # and the losers logged a save failure on every run.
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - name: Cluster roles and schema grants (infra/postgres/init)
        # Roles are CLUSTER objects and infra owns them; the service container runs no init SQL,
        # so this is what a local `pnpm infra:up` does on first boot — the SAME two files, as the
        # container's superuser, which nothing after this step uses. It must precede migrate:
        # 0001's GRANT names app_user, 02 gives app_admin CREATE on public, and the invariants
        # query every role by name.
        env:
          SUPERUSER_URL: postgres://heliogrid:heliogrid@localhost:5432/heliogrid_ci
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/02-databases.sql
      - name: Apply migrations (CI database)
        # Must run before pnpm check:all so the invariants have tables to inspect.
        run: pnpm --filter @heliogrid/db migrate
      - name: Quality gate
        # pnpm check:all = build → lint (Biome and its plugins, dependency-cruiser, sherif, turbo
        # boundaries) → typecheck → check:dupes → check:openapi (spec freshness) → check:catalogs
        # → test:unit → test (invariants, with this job's database).
        # BUILD FIRST: dependency-cruiser resolves a workspace import through the target's
        # `main`/`types`, which point at dist/ — so before anything is built the edge does not
        # exist and every rule aimed at a dist-shipping package reports clean.
        # test:unit runs vitest WITH COVERAGE: the per-slice 100% thresholds in vitest.config.mts
        # are what stop an edge case being deleted with its test.
        run: pnpm check:all
      - name: No breaking API change against the base (oasdiff 1.31.0)
        # Judged on the pull request only: a push to main has no base to compare. The build is
        # pinned by version and sha256, so every run grades a change the same way. A response
        # enum that grows by design is declared x-extensible-enum; any other ERR-level finding
        # needs the owner's ruling, stated in the change, before it merges.
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/oasdiff"; mkdir -p "$tool"
          curl -fsSL -o "$tool/oasdiff.tar.gz" \
            https://github.com/oasdiff/oasdiff/releases/download/v1.31.0/oasdiff_1.31.0_linux_amd64.tar.gz
          echo "0177d4bc0bf04f4061e9277795b77335ee100a43b508e94fce5c46de083bbede  $tool/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf "$tool/oasdiff.tar.gz" -C "$tool"
          bin="$(find "$tool" -type f -name oasdiff | head -1)"
          [ -n "$bin" ] || { echo "::error::no oasdiff binary in the release archive"; exit 1; }
          # A base that cannot be read is a failure; only a spec the base does not have yet passes.
          git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null \
            || { echo "::error::origin/$BASE_REF is not fetched, so nothing can be compared"; exit 1; }
          spec=packages/contracts/openapi/openapi.json
          if ! git cat-file -e "origin/$BASE_REF:$spec" 2>/dev/null; then
            echo "no spec on $BASE_REF yet: nothing to break"; exit 0
          fi
          git show "origin/$BASE_REF:$spec" > "$tool/base.json"
          "$bin" breaking "$tool/base.json" "$spec" --fail-on ERR
      # No native splash-colour freshness gate: the splash artifacts are FROZEN (see the $comment
      # in SplashCanvas.colorset/Contents.json) and the gate returns when packages/theme re-emits
      # them. Never gate on `pnpm --filter <pkg> build` for a package that can be deleted: pnpm
      # exits 0 on an unmatched filter, so the step regenerates nothing, `git status` is clean,
      # and the gate passes green while proving nothing. A gate that cannot run is worse than no
      # gate: it reports success forever.

  # The regression suite's web half (tests/e2e): every shipped route driven in a real browser
  # against the BUILT api and web, then the component suite. Playwright's webServer starts both
  # servers and this job starts none, so one api holds 8084. The phone half runs in the android
  # and ios jobs. retries: 0; a failure uploads its traces and the api's log to replay it.
  e2e-web:
    name: e2e-web
    needs: changes
    if: needs.changes.outputs.e2e_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: &suite-postgres
        # The same pinned image the quality lane runs.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: heliogrid
          POSTGRES_PASSWORD: heliogrid
          POSTGRES_DB: heliogrid_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heliogrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &suite-api-env
      # What the api's boot validates, as the quality lane sets it; the development message
      # delivery writes each sign-in code to the api's log, where the suite reads it.
      DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/heliogrid_ci
      DATABASE_ADMIN_URL: postgres://app_admin:app_admin@localhost:5432/heliogrid_ci
      TEMPORAL_ADDRESS: 127.0.0.1:1
      TEMPORAL_NAMESPACE: heliogrid
      TEMPORAL_TLS_CA_FILE: /dev/null
      TEMPORAL_TLS_CERT_FILE: /dev/null
      TEMPORAL_TLS_KEY_FILE: /dev/null
      TEMPORAL_AUTH_TOKEN_FILE: /dev/null
      DEV_OTP_PHONES: "+919999999999"
      DEV_OTP_CODE: "000000"
      AUTH_TOKEN_SECRET: ci-only-token-signing-secret-heliogrid-quality-lane-0001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - name: Cluster roles and schema grants (infra/postgres/init)
        env:
          SUPERUSER_URL: postgres://heliogrid:heliogrid@localhost:5432/heliogrid_ci
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/02-databases.sql
      - name: Apply migrations (CI database)
        run: pnpm --filter @heliogrid/db migrate
      - name: Build the api, the web and what the suite imports
        run: pnpm turbo build --filter=@heliogrid/api --filter=@heliogrid/web --filter='@heliogrid/e2e^...'
      - name: Publish the India market pack (the api's own writer)
        # A fresh database holds no market pack, and the api refuses a sign-in code for a number no
        # published pack reaches ("We cannot send messages to that country yet"), so every flow that
        # asks for a code would fail. After the build: the command imports what the build emits.
        run: pnpm --filter @heliogrid/api pack:publish
      - name: Install Chromium
        run: pnpm --filter @heliogrid/e2e exec playwright install --with-deps chromium
      - name: Web flows (tests/e2e/web)
        run: pnpm --filter @heliogrid/e2e test:web
      - name: Component tests (tests/e2e/components)
        if: success() || failure()
        run: pnpm --filter @heliogrid/e2e test:ct
      - name: Keep the traces and the api's log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-traces
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
            .qa/api.log
          include-hidden-files: true
          retention-days: 14

  mobile-js:
    name: mobile-js
    needs: changes
    if: needs.changes.outputs.mobile_js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          # Keyed by JOB as well as commit. A cache key is write-once, so three ubuntu jobs
          # sharing one meant whichever finished first decided what the other two restored,
          # and the losers logged a save failure on every run.
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='@heliogrid/mobile^...'
      - name: Bundle the RN JavaScript (Law 7's only proof that the JS resolves)
        working-directory: apps/mobile
        # Neither native lane bundles JS — a debug build loads it from Metro at runtime — so
        # this is the one mechanical proof the React Native JavaScript even resolves: a broken
        # import path, a renamed asset, a Metro resolution failure of a workspace package, or a
        # package-exports change in a dependency all pass typecheck. Only the bundler walks the
        # real module graph the app runs on. No `.ios.*`/`.android.*` file exists, so the
        # android bundle covers the whole graph.
        run: pnpm bundle

  # The two native jobs build the debug app, then run the phone flows on it: tests/e2e/mobile/run.sh
  # against the BUILT api and a Metro this job starts, since a debug build loads its JavaScript
  # from Metro and bundles none. They run on main as well as the pull request: setup-gradle and a
  # cache written on a pull request stay with that pull request, so main is what warms them for
  # the next one. The repository variable PHONE_E2E=off skips every flow step and keeps the build,
  # so the required check still reports: `gh variable set PHONE_E2E --body off` turns the flows
  # off, `gh variable delete PHONE_E2E` back on. While off they run nowhere, and each run warns so.
  # Never a retry: a flake is a bug (tests/e2e/CLAUDE.md).
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.phone_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres: *suite-postgres
    env: *suite-api-env
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      # Before every flow step, so the switch never skips the build: autolinking and codegen read
      # package.json and native sources only, and a debug APK holds no JavaScript.
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Phone flows OFF
        if: vars.PHONE_E2E == 'off'
        run: echo "::warning::phone flows OFF (PHONE_E2E=off) — they ran nowhere on this change"
      - uses: actions/cache@v4
        if: vars.PHONE_E2E != 'off'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Cluster roles and schema grants (infra/postgres/init)
        if: vars.PHONE_E2E != 'off'
        env:
          SUPERUSER_URL: postgres://heliogrid:heliogrid@localhost:5432/heliogrid_ci
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/02-databases.sql
      - name: Apply migrations (CI database)
        if: vars.PHONE_E2E != 'off'
        run: pnpm --filter @heliogrid/db migrate
      - name: Build the api, what Metro bundles and what the suite imports
        if: vars.PHONE_E2E != 'off'
        run: pnpm turbo build --filter=@heliogrid/api --filter='@heliogrid/mobile^...' --filter='@heliogrid/e2e^...'
      - name: Publish the India market pack (the api's own writer)
        # The api refuses a sign-in code for a number no published pack reaches (see e2e-web).
        if: vars.PHONE_E2E != 'off'
        run: pnpm --filter @heliogrid/api pack:publish
      - name: Start the api and Metro, and warm the bundle
        # The api writes .qa/api.log, where run.sh reads each sign-in code. The bundle is asked for
        # once before any flow: a flow that meets a cold Metro waits on the first build and loses
        # its step (deferred.md D90). A readiness wait, never a retry of a flow.
        if: vars.PHONE_E2E != 'off'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa
          nohup pnpm --filter @heliogrid/api start > .qa/api.log 2>&1 &
          nohup pnpm --filter @heliogrid/mobile start > .qa/metro.log 2>&1 &
          ready() { for _ in $(seq 120); do curl -fsS "$1" > /dev/null 2>&1 && return 0; sleep 1; done; return 1; }
          ready http://localhost:8084/health/ready || { echo '::error::the api never became ready'; tail -50 .qa/api.log; exit 1; }
          ready http://localhost:8081/status || { echo '::error::Metro never started'; tail -50 .qa/metro.log; exit 1; }
          time curl -fsS -o /dev/null 'http://localhost:8081/index.bundle?platform=android&dev=true&minify=false'
      - uses: actions/cache@v4
        if: vars.PHONE_E2E != 'off'
        with:
          path: ~/maestro
          key: maestro-${{ runner.os }}-2.11.0
      - name: Install Maestro 2.11.0
        # The version the suite is written against, checked by the release's own sha256.
        if: vars.PHONE_E2E != 'off'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/maestro/bin/maestro" ]; then
            curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
              https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
            echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          fi
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        # The emulator's hardware speed-up; without it Android boots in minutes, not seconds.
        if: vars.PHONE_E2E != 'off'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: avd-cache
        if: vars.PHONE_E2E != 'off'
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_8
      - name: Create the emulator and its boot snapshot (cache miss only)
        if: vars.PHONE_E2E != 'off' && steps.avd-cache.outputs.cache-hit != 'true'
        # v2.38.0, pinned by commit: an update to the action never runs unread.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "boot snapshot saved for the cache"
      - name: Phone flows (tests/e2e/mobile) on the emulator
        if: vars.PHONE_E2E != 'off'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One line: the action runs each line of `script` in its own shell. The device's log is
          # read before the emulator stops, which is when this step ends.
          script: adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk && bash tests/e2e/mobile/run.sh emulator-5554 || { adb logcat -d > .qa/device.log; exit 1; }
      - name: Keep the flows' screenshots and the logs of a failure
        if: failure() && vars.PHONE_E2E != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: phone-flows-android
          path: |
            ~/.maestro/tests/
            .qa/api.log
            .qa/metro.log
            .qa/device.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: ios
    needs: changes
    # Native builds run on the pull request only: the same tree already built there.
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The Gemfile.lock resolves the `ruby` platform only (apps/mobile/.bundle/config sets the
      # same flag locally); without it bundler refuses the darwin platform of the runner.
      BUNDLE_FORCE_RUBY_PLATFORM: '1'
      # The lock says `BUNDLED WITH 1.17.2`, written by the system Ruby 2.6 the template ran on.
      # Bundler 1.17 cannot run on Ruby 3.2+ (`String#untaint` is gone), and Bundler's default
      # is to install and switch to the locked version anyway. `system` keeps the Ruby's own
      # Bundler in charge; the lock's resolution is unchanged and still honoured.
      BUNDLE_VERSION: system
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No `turbo build`, for the same reason as the android lane: a Debug configuration loads
      # its JavaScript from Metro and `react-native-xcode.sh` bundles nothing.
      - uses: ruby/setup-ruby@v1
        with:
          # 3.1 is the newest Ruby the lock resolves on: apps/mobile/Gemfile.lock was written under
          # the system Ruby 2.6 and pins CFPropertyList 3.0.9, which refuses Ruby >= 3.2. Regenerating
          # the lock with a modern Bundler lifts this; that is a mobile chore with its own PR.
          ruby-version: '3.1'
          working-directory: apps/mobile
          # `none`: the action would otherwise install the lock's Bundler 1.17.2 (see the job env).
          bundler: none
          # Installs the Gemfile.lock's CocoaPods into vendor/bundle and caches it by lockfile
          # hash — the pinned version React Native's template expects, not whatever `gem` finds.
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
      - name: Pod install
        working-directory: apps/mobile/ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/apps/mobile/Gemfile
        run: bundle exec pod install
      - name: Build for simulator (no signing)
        working-directory: apps/mobile/ios
        # `shell: bash` turns on `-o pipefail`. Without it the step's exit status is
        # `tail`'s (always 0), so a Swift compile error, a missing Pod or a bad Info.plist
        # produced a GREEN job — the only mechanical proof the RN app still builds for iOS
        # (Law 7) could never fail.
        shell: bash
        run: |
          xcodebuild -workspace HelioGridMobile.xcworkspace \
            -scheme HelioGridMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -50
