# Keeps the actions in .github/workflows current. One grouped PR a week, never one per action.
# npm dependencies are NOT here on purpose: every manifest pins exact versions and `sherif`
# compares them, so a bump is a deliberate `pnpm add`, not a bot's PR (CLAUDE.md §8).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # The base images both server Dockerfiles pin by digest. A digest cannot age out on its own —
  # a pinned base is only as current as the last person who moved it, which is exactly the kind of
  # thing nobody remembers to do. npm stays absent for the reason above: a bump there is a
  # deliberate `pnpm add`, and every manifest pins exact versions.
  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/worker']
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      base-images:
        patterns: ['*']
