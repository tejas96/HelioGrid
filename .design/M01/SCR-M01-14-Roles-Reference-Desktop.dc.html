     PRD rule id never reaches the screen (D247), so a phrase that is only a rule id drops. */
  permissionsOf(roleIndex) {
    const ruleOnly = { "(surface obeys F2-06)": null, "(coordinator, F2-07 attribution)": "coordinator" };
    const can = [];
    const cant = [];
    this.matrixSpec().forEach(([text, cells], i) => {
      const raw = cells[roleIndex];
      if (raw === "—") { cant.push({ key: "x" + i, text: text }); return; }
      const written = raw === "✓" ? null : (raw.indexOf("✓ ") === 0 ? raw.slice(2) : raw);
      const kept = written in ruleOnly ? ruleOnly[written] : written;
      const scope = kept ? kept.replace(/^\((.*)\)$/, "$1") : null;
      can.push({ key: "c" + i, text: text, scope: scope });
    });
    return { can, cant };
  }

    };

    /* THE SHELL (F7-22, F7-48): the EPC Owner's destinations on the rail, the bell and the account at
       its foot; the header holds only the tenant's name and the one search. */
    vals.rail = h(NS.AppRail, {
      label: "Main", value: "more", onChange: this.noop,
      items: [
        { key: "home", label: "Home", icon: glyph(dest("home")), activeIcon: glyph(dest("home"), true) },
        { key: "leads", label: "Leads", icon: glyph(dest("leads")), activeIcon: glyph(dest("leads"), true) },
        { key: "projects", label: "Projects", icon: glyph(dest("projects")), activeIcon: glyph(dest("projects"), true) },
        { key: "more", label: "More", icon: glyph(dest("more")), activeIcon: glyph(dest("more"), true) },
      ],
      footer: [{ key: "notifications", label: "Notifications", icon: glyph("bell"), onClick: this.noop }],
      avatar: h(NS.AccountMenu, {
        name: "Rajesh Kulkarni", triggerName: "Rajesh Kulkarni — account, grievance contact and sign out", menuLabel: "Account",
        grievanceLabel: "Grievance officer", signOutLabel: "Sign out",
        onGrievance: this.noop, onSignOut: this.noop, align: "start",
      }),
    });
    vals.deskHeader = h(NS.AppHeader, {
      tenant: h("span", { style: { fontSize: "var(--fs-body-sm)", fontWeight: "var(--fw-bold)", color: "var(--text-primary)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, "Suryodaya Solar"),
      search: h(NS.SearchField, {
        density: "functional", placeholder: "Name, phone or city", value: "", onChange: this.noop,
      }),
    });

    /* G4's side list: the way back at this width, so the page carries no breadcrumb. */
    vals.sideGroups = this.sideSpec().map((g, gi) => ({
      key: g.key, name: g.name || "", named: !!g.name,
      above: gi === 0 ? "0" : "var(--sp-4)",
      rows: g.rows.map(([key, name, glyphName]) => {
        const current = key === "roles";
        return {
          key: key, name: name, glyph: glyphName,
          current: current ? "page" : undefined,
          ground: current ? "var(--accent-subtle)" : "transparent",
          ink: current ? "var(--accent)" : "var(--text-primary)",
          weight: current ? "var(--fw-bold)" : "var(--fw-regular)",
          tone: current ? "accent" : "secondary",
        };
      }),
    }));

    vals.ask = {
      label: "About roles", title: "About roles", density: "functional", placement: "bottom",
      pages: [
        "Roles can't be created, renamed or deleted, so a role means the same for everyone. You give someone a role from their row in Team.",
        "Counts include active members only. Someone whose invite is still open, or who was deactivated, is named under the role but not counted.",
      ],
    };

    /* THE TILES — the phone's tiles, four across; three across while the side panel is open, so no
       tile sits under it. The count is a count, so it carries no tier (F8-01). */
    const tiles = (openId, count) => roles.map((r) => {
      const open = r.id === openId;
      return {
        key: r.id, name: r.name, glyph: r.glyph, open: open,
        ground: open ? "var(--accent-subtle)" : "var(--fill)",
        iconTone: open ? "var(--accent)" : "var(--text-secondary)",
        glyphTone: open ? "accent" : "secondary",
        counted: count === "shown", loading: count === "loading",
        count: people(holders[r.id].n),
        loadingLabel: "Loading how many people hold " + r.name,
      };
    });

    /* THE SIDE PANEL — the phone's sheet at this width: head, holders and the Show switch stay put
       in the panel's head; only the list scrolls. Non-modal, so another tile swaps the role. */
    const panel = (roleId, side) => {
      const ix = roles.findIndex((r) => r.id === roleId);
      const role = roles[ix];
      const hold = holders[roleId];
      const lists = this.permissionsOf(ix);
      const tick = h("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "var(--success-text)", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true, style: { flex: "0 0 auto" } }, h("path", { d: "M5 12.5l4.5 4.5L19 7.5" }));
      const dash = h("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "var(--mark-subtle)", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true, style: { flex: "0 0 auto" } }, h("path", { d: "M7 12h10" }));
      const can = side === "can";
      const rows = (can ? lists.can : lists.cant).map((p) => h("li", {
        key: p.key, style: { display: "flex", alignItems: "center", gap: "var(--sp-3)", minHeight: 36 },
      }, [
        h("span", { key: "m", style: { display: "inline-flex" } }, can ? tick : dash),
        h("span", { key: "t", style: { minWidth: 0, fontSize: "var(--fs-body)", lineHeight: "var(--lh-body)", color: can ? "var(--text-primary)" : "var(--text-secondary)" } }, [
          p.text,
          p.scope ? h("span", { key: "s", style: { color: "var(--text-secondary)" } }, " · " + p.scope) : null,
        ]),
      ]));
      const holdersRow = h("div", { style: { display: "flex", alignItems: "center", gap: 10, minHeight: 32 } }, hold.n > 0
        ? [h(NS.AvatarGroup, { key: "a", size: 32, people: hold.who.map((n) => ({ name: n })) }), h("span", { key: "n", style: textStyle() }, hold.who.join(", "))]
        : [h("span", { key: "z", style: textStyle() }, "Nobody holds this yet")]);
      const aside = hold.aside ? h("div", { style: { display: "flex", alignItems: "center", flexWrap: "wrap", gap: "var(--sp-2)" } }, [
        h(NS.StatusChip, { key: "c", status: hold.aside.word.toLowerCase(), label: hold.aside.word, tone: hold.aside.tone, density: "functional" }),
        h("span", { key: "n", style: textStyle() }, hold.aside.name),
      ]) : null;
      return {
        open: true, inset: true, modal: false, side: "right", width: 480, density: "functional",
        onClose: this.noop, showClose: true,
        title: role.name,
        leading: h(NS.IconCircle, { size: 44, color: "var(--accent)" }, h(NS.ShellGlyph, { name: role.glyph, size: "md", tone: "accent" })),
        meta: h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--sp-4)", paddingBottom: "var(--sp-2)" } }, [
          h("span", { key: "d", style: textStyle("var(--text-secondary)") }, role.desc),
          h("div", { key: "h" }, holdersRow),
          aside ? h("div", { key: "x" }, aside) : null,
          h(NS.SegmentedControl, {
            key: "s", label: "Show", value: side, onChange: this.noop,
            options: [
              { value: "can", label: "Can do · " + lists.can.length },
              { value: "cant", label: "Can't · " + lists.cant.length },
            ],
          }),
        ]),
        children: h("ul", {
          "aria-label": can ? "What " + role.name + " can do" : "What " + role.name + " can't do",
          style: { listStyle: "none", margin: 0, padding: 0, display: "flex", flexDirection: "column" },
        }, rows),
      };
    };

    const frame = (id, label, screenLabel, opts) => Object.assign({
      id: id, label: label, screenLabel: screenLabel,
      columns: 4, rightPad: "var(--sp-8)", tiles: tiles(null, "shown"),
      panelOpen: false, panel: null, fromAssign: false,
    }, opts || {});

    vals.frames = [
      frame("d-default", "1536 · default · the roles at rest", "Roles reference — 1536, at rest"),
      frame("d-open", "1536 · default · one role opened in the side panel", "Roles reference — 1536, one role opened", {
        columns: 3, rightPad: "calc(480px + var(--sp-8))",
        tiles: tiles("sales-exec", "shown"), panelOpen: true, panel: panel("sales-exec", "can"),
      }),
      /* LOADING: the twelve names are static and draw at once; only each count waits, in its own
         place, so the skeleton is the tile grid itself. */
      frame("d-from-assign", "1536 · opened from Assign roles", "Roles reference — 1536, opened from Assign roles", { fromAssign: true }),
      frame("d-loading", "1536 · loading", "Roles reference — 1536, loading", { tiles: tiles(null, "loading") }),
    ];

    this._vals = vals;
    return vals;
  }
}
</script>
</body>
</html>
