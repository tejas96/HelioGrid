      ["Mint, label and re-mint a customer link for a named contact", ["✓", "✓", "✓", "—", "—", "—", "—", "—", "—", "—", "—", "—"]],
      ["Revoke a customer link, including regenerate-with-revoke", ["✓", "✓", "✓", "—", "—", "—", "—", "—", "—", "—", "—", "—"]],
    ];
  }

  /* One role's two lists, in F2's order. A scoped cell keeps the person's part of F2's phrase; a
     PRD rule id never reaches the screen (D247), so a phrase that is only a rule id drops. */
  permissionsOf(roleIndex) {
    const ruleOnly = { "(surface obeys F2-06)": null, "(coordinator, F2-07 attribution)": "coordinator" };
    const can = [];
    const cant = [];
    this.matrixSpec().forEach(([text, cells], i) => {
      const raw = cells[roleIndex];
      if (raw === "—") { cant.push({ key: "x" + i, text: text }); return; }
      const written = raw === "✓" ? null : (raw.indexOf("✓ ") === 0 ? raw.slice(2) : raw);
      const kept = written in ruleOnly ? ruleOnly[written] : written;
      const scope = kept ? kept.replace(/^\((.*)\)$/, "$1") : null;
      can.push({ key: "c" + i, text: text, scope: scope });
    });
    return { can, cant };
  }

  renderVals() {
    const ds = this.state.ds;
    /* Nothing renders until the bundle has loaded; then one set of values serves every frame. */
    if (!ds) return {};
    if (this._vals) return this._vals;
    const h = React.createElement;
    const NS = ds;

    const glyph = (name, filled, tone) => h(NS.ShellGlyph, { name: name, size: "lg", filled: !!filled, tone: tone });
    const dest = (key) => NS.DESTINATION_GLYPH[key];
    const roles = this.roleSpec();
    const holders = this.holderSpec();
    const people = (n) => (n === 1 ? "1 person" : n + " people");

    const topBar = {
      title: "Roles reference", sticky: false,
      leading: h(NS.ShellAction, {
        round: true, label: "Back to assign roles", onClick: this.noop,
        icon: h(NS.ShellGlyph, { name: "chevron-left", size: "md", tone: "primary" }),
      }),
      searchLabel: "Search", onSearchClick: this.noop,
      notificationsLabel: "Notifications",
    };
    const topBarScrolled = Object.assign({}, topBar, { scrolled: true });

    /* THE TILES. The count is a count, so it carries no tier (F8-01). `count` is how the count
       slot reads: a figure, a loading bar in the figure's own place, or the named gap. */
    const tiles = (openId, count) => roles.map((r) => {
      const open = r.id === openId;
      return {
        key: r.id, name: r.name, glyph: r.glyph, open: open,
        ground: open ? "var(--accent-subtle)" : "var(--fill)",
        iconTone: open ? "var(--accent)" : "var(--text-secondary)",
        glyphTone: open ? "accent" : "secondary",
        counted: count === "shown", loading: count === "loading", gap: count === "failed",
        count: people(holders[r.id].n),
        loadingLabel: "Loading how many people hold " + r.name,
      };
    });

    /* THE DETAILS SHEET. Head, holders and the Show switch stay put; only the list scrolls. */
    const sheet = (roleId, side, scrolledBy) => {
      const ix = roles.findIndex((r) => r.id === roleId);
      const role = roles[ix];
      const hold = holders[roleId];
      const lists = this.permissionsOf(ix);
      const rows = (side === "can" ? lists.can : lists.cant).map((p) => ({
        key: p.key, text: p.text, scope: p.scope || "", hasScope: !!p.scope,
        can: side === "can", cant: side !== "can",
        ink: side === "can" ? "var(--text-primary)" : "var(--text-secondary)",
      }));
      return {
        titleId: "m14-sheet-" + roleId + "-" + side,
        name: role.name, desc: role.desc, glyph: role.glyph,
        held: hold.n > 0, nobody: hold.n === 0,
        avatars: { size: 32, people: hold.who.map((n) => ({ name: n })) },
        names: hold.who.join(", "),
        hasAside: !!hold.aside,
        asideChip: hold.aside ? { status: hold.aside.word.toLowerCase(), label: hold.aside.word, tone: hold.aside.tone, density: "functional" } : null,
        asideName: hold.aside ? hold.aside.name : "",
        show: {
          label: "Show", value: side, onChange: this.noop,
          options: [
            { value: "can", label: "Can do · " + lists.can.length },
            { value: "cant", label: "Can't · " + lists.cant.length },
          ],
        },
        listLabel: side === "can" ? "What " + role.name + " can do" : "What " + role.name + " can't do",
        rows: rows,
        scrolledBy: scrolledBy ? "calc(-1 * " + scrolledBy + ")" : "0",
        cutEdge: scrolledBy ? "1px solid var(--line-soft)" : "none",
      };
    };

    const frame = (id, label, screenLabel, opts) => Object.assign({
      id: id, label: label, screenLabel: screenLabel,
      topBar: topBar, listEdge: "flex-start", countsFailed: false,
      tiles: tiles(null, "shown"), sheetOpen: false, sheet: null,
    }, opts || {});

    const vals = {
      noop: this.noop,
      phoneChrome: { style: { background: "transparent" } },
      /* F7-48's EPC Owner bar: Home · Leads · the verb · Projects · More, More in view. */
      nav: {
        value: "more", onChange: this.noop,
        items: [
          { key: "home", label: "Home", icon: glyph(dest("home")), activeIcon: glyph(dest("home"), true, "inverse") },
          { key: "leads", label: "Leads", icon: glyph(dest("leads")), activeIcon: glyph(dest("leads"), true, "inverse") },
          { key: "add", verb: true, label: "Add lead", icon: glyph("plus-circle"), onClick: this.noop },
          { key: "projects", label: "Projects", icon: glyph(dest("projects")), activeIcon: glyph(dest("projects"), true, "inverse") },
          { key: "more", label: "More", icon: glyph(dest("more")), activeIcon: glyph(dest("more"), true, "inverse") },
        ],
      },
      ask: {
        label: "About roles", title: "About roles", density: "functional", placement: "bottom", inset: true,
        pages: [
          "Roles can't be created, renamed or deleted, so a role means the same for everyone. You give someone a role from their row in Team.",
          "Counts include active members only. Someone whose invite is still open, or who was deactivated, is named under the role but not counted.",
        ],
      },
      /* COUNTS UNAVAILABLE: one banner with the retry; each count's place names the gap. The
         roles, their names and every permission still render. */
      countsBanner: {
        kind: "data-integrity", density: "functional",
        title: "Holder counts didn't load",
        action: h(NS.BannerAction, { onClick: this.noop }, "Try again"),
      },
    };

    vals.frames = [
      frame("m-default", "375 · default · the roles at rest", "Roles reference — at rest"),
      frame("m-open", "375 · default · one role opened, what it can do", "Roles reference — one role opened", {
        tiles: tiles("sales-exec", "shown"), sheetOpen: true, sheet: sheet("sales-exec", "can", null),
      }),
      frame("m-open-cant", "375 · default · the same role, what it can't do, scrolled", "Roles reference — what it can't do", {
        tiles: tiles("sales-exec", "shown"), sheetOpen: true, sheet: sheet("sales-exec", "cant", "calc(5 * 36px)"),
      }),
      frame("m-foot", "375 · default · the foot of the roles", "Roles reference — foot of the roles", {
        topBar: topBarScrolled, listEdge: "flex-end",
      }),
      /* LOADING: the twelve names are static and draw at once; only each count waits, in its own
         place, so the skeleton is the tile grid itself. */
      frame("m-loading", "375 · loading", "Roles reference — loading", { tiles: tiles(null, "loading") }),
      frame("m-zero", "375 · zero-holders-shown", "Roles reference — zero holders", {
        tiles: tiles("sales-manager", "shown"), sheetOpen: true, sheet: sheet("sales-manager", "can", null),
      }),
      frame("m-nocounts", "375 · counts-unavailable", "Roles reference — counts unavailable", {
        tiles: tiles(null, "failed"), countsFailed: true,
      }),
    ];

    this._vals = vals;
    return vals;
  }
}
</script>
