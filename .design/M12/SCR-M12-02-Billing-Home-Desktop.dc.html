   7-day refund window, F1-28's 18% GST. Sample content is the billing screens' one story. */

const EARLY_PAUSE = "2026-09-17";

const GST = 0.18;
const CYCLE_WITH_GST = GROWTH.mo * (1 + GST);
const ENTERPRISE_WITH_GST = ENTERPRISE_MO * (1 + GST);
const INVOICE = "HG-INV-2026-0902";

const DEAD_PAUSED = "Creating or editing leads, tasks, activities, surveys and designs · generating or sending proposals · marking won or lost · project updates · new uploads · voice calls · AI detections · teammate invites";

class Component extends DCLogic {

  componentWillUnmount() { clearInterval(this._poll); }

    const h = React.createElement;

  /* ---- SCR-SHELL-06's strip, reused: a title, then fact rows of one family (mark · word · value). ---- */
  strip(kind, title, rows) {
    const h = React.createElement;
    return {
      kind: kind, title: title,
      body: h(this.NS.FactRows, { label: title, density: "expressive", form: "lead" },
        rows.map((r) => h(this.NS.FactRow, { key: r[1], mark: this.stateMark(r[0]), label: r[1], value: r[2], provenance: r[3] || undefined }))),

  }

  /* ---- SCR-M12-04's Needs you row: the name with its chip under it, the figure on the right edge. ---- */
  needRow(key, name, chipWord, tone, value, prov) {
    const h = React.createElement;
    const label = chipWord
      ? h("span", { style: { display: "flex", flexDirection: "column", alignItems: "flex-start", gap: "var(--sp-2)", minWidth: 0 } }, [h("span", { key: "n" }, name), h("span", { key: "c" }, this.chip(chipWord, tone))])

    return { key: key, node: h(this.NS.FactRows, { label: name, density: "expressive", form: "pair", style: { gridTemplateColumns: "minmax(0,1fr) max-content", maxWidth: "100%" } },
      h(this.NS.FactRow, { label: label, value: value ? this.right(value, /[₹]/.test(value)) : undefined, provenance: prov || undefined })) };
  }
  /* What the strip does not carry, in the strip's own row form: the data is intact. */
  dataKeptRow() {
    const h = React.createElement;
    return { key: "intact", node: h(this.NS.FactRows, { label: "Your data", density: "expressive", form: "lead" },
      h(this.NS.FactRow, { label: "Your data", value: "Every lead, design, proposal and project — kept", mark: this.stateMark("intact") })) };
  }
  needsBlock(title, rows, act, o) {

  /* The amount's working, under the figure: the invoice, the price, the tax, the day it was tried. */
  dunDeriv(failedOn) {

      { kind: "formula", label: "Amount", text: ["Invoice ", this.mono(INVOICE), " — Growth for the cycle from 1 Sept: ", this.mono(this.F.money(GROWTH.mo)), " + 18% GST = ", this.mono(this.money(CYCLE_WITH_GST)), "."] },
      { kind: "note", label: "Charged", text: "Attempted on " + this.F.date(failedOn) + ", which is day 0 of the 7-day grace." },

    const t = o || {};

      block: Object.assign({ density: "expressive", title: "Your plan", badge: this.chip(chipWord, tone) }, t.source ? { provenance: { source: t.source } } : {}),

  nextBill(label, date, amount) {
    const h = React.createElement;
    return { key: label, label: label, prov: null, value: h("span", { style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "var(--sp-0-5)" } }, [

  }
  standardPlan(chipWord, tone, o) {
    const t = o || {};

  /* ---- SCR-M12-04's meter row ---- */
  meter(label, value, limit) {
    const m = { label: label, value: value, limit: limit, density: "expressive" };

  usageBlock(meters, limitsSource) {

  /* ---- the payment method as the gateway names it, never an instrument detail ---- */
  methodBlock(o) {

  /* ---- invoices: date and state on the left; the PDF, then the amount on the right edge ---- */
  invoiceRow(amount, date, state, tone, number, what) {

  }
  invoicesBlock(o) {
    const t = o || {};
    const rows = t.rows || [
      this.invoiceRow(CYCLE_WITH_GST, "2026-09-01", t.latestState || "Paid", t.latestTone || "success", INVOICE),
      this.invoiceRow(CYCLE_WITH_GST, "2026-08-01", "Paid", "success", "HG-INV-2026-0874"),

      rows: rows,

  }
  historyRows() {
    const rest = { background: "var(--fill)", boxShadow: "none", borderRadius: "var(--r-tile)" };
    return [
      { key: "d", title: "Payment reminders", subtitle: "Every reminder sent, and when", trailing: this.glyph("chevron-right"), onClick: this.noop, density: "expressive", style: rest },
      { key: "h", title: "Plan history", subtitle: "Every state, when, and why", trailing: this.glyph("chevron-right"), onClick: this.noop, density: "expressive", style: rest },
    ];
  }

  /* ---- the shell: a page opened from the settings list ---- */
  topBar() {
    return {
      title: "Billing", sticky: false,
      leading: React.createElement(this.NS.ShellAction, { round: true, label: "Back to settings", onClick: this.noop, icon: this.glyph("chevron-left", "md", "primary") }),
      searchLabel: "Search", onSearchClick: this.noop, notificationsLabel: "Notifications",

  }
  /* The EPC Owner's footer (and, on frame 18, the same bar for a Sales Manager). The verb rides the fab item. */
  nav() {
    const D = this.NS.DESTINATION_GLYPH;
    const g = (name, filled, tone) => React.createElement(this.NS.ShellGlyph, { name: name, size: "lg", filled: !!filled, tone: tone });
    return {
      value: "more", onChange: this.noop,
      items: [
        { key: "home", label: "Home", icon: g(D.home), activeIcon: g(D.home, true, "inverse") },
        { key: "leads", label: "Leads", icon: g(D.leads), activeIcon: g(D.leads, true, "inverse") },
        { key: "add", fab: true, label: "Add lead", icon: g("plus-circle"), onClick: this.noop },
        { key: "projects", label: "Projects", icon: g(D.projects), activeIcon: g(D.projects, true, "inverse") },
        { key: "more", label: "More", icon: g(D.more), activeIcon: g(D.more, true, "inverse") },
      ],

  }

  /* ---- one frame; a state supplies only what it changes ---- */
  frame(o) {
    return {
      key: o.key, id: "m12-02-" + o.key, label: o.label, screenLabel: o.screenLabel,
      height: (o.height || 812) + "px", offset: o.offset || "0px",
      topBar: this.topBar(), nav: this.nav(),
      strip: o.strip || null, errorBlock: o.errorBlock || null,
      needs: o.needs === undefined ? null : o.needs,
      plan: o.plan === undefined ? this.standardPlan("Active", "success") : o.plan,
      usage: o.usage === undefined ? this.usageBlock([this.meter("AI detections", 61, GROWTH.detections), this.meter("Proposals", 187, GROWTH.proposals)]) : o.usage,
      method: o.method === undefined ? this.methodBlock() : o.method,
      invoices: o.invoices === undefined ? this.invoicesBlock() : o.invoices,
      history: o.history === undefined ? this.historyRows() : o.history,
      cancel: o.cancel === undefined ? { variant: "ghost", size: "md", tone: "danger", onClick: this.noop } : o.cancel,
      sheet: o.sheet || null, sheetBody: o.sheetBody || null,

  }

  pastDueNeeds() {
    return this.needsBlock("Needs you", [
      this.needRow("due", "Payment failed", "Past due", "danger", this.money(CYCLE_WITH_GST), this.derived()),
      this.needRow("until", "Grace ends", null, null, this.F.date(GRACE_ENDS)),
    ], "Pay", { line: "Paid on your provider's own page.", deriv: this.dunDeriv(FAILED_ON) });
  }
  wayBack(chipWord, deriv) {
    return this.needsBlock("The way back", [
      this.needRow("state", "Account", chipWord, "danger", null),
      this.needRow("owed", "To reactivate", null, null, this.money(CYCLE_WITH_GST), this.derived()),
      this.dataKeptRow(),
    ], "Reactivate", { line: "One payment. Everything returns the moment the payment confirms.", deriv: deriv });
  }
  deadStrip(title) {
    return this.strip("dunning", title, [["paused", "Paused", DEAD_PAUSED], ["works", "Still works", DEAD_WORKS]]);
  }
  trialMethod() { return this.methodBlock({ gap: "Set up when you choose a plan", noAct: true }); }

  /* ---- the sheets ---- */
  cancelSheet() {
    const h = React.createElement; const NS = this.NS;
    const footer = h(NS.SheetActions, {}, [
      h(NS.Button, { key: "skip", variant: "ghost", onClick: this.noop }, "Skip"),
      h(NS.Button, { key: "go", variant: "destructive", onClick: this.noop }, "Cancel subscription"),
    ]);
    const body = h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--sp-4)" } }, [
      h(NS.FactRows, Object.assign({ key: "rows" }, this.pair("Cancelling")), [
        h(NS.FactRow, { key: "r", label: "Runs until", value: this.right(this.F.date(NEXT_BILL)) }),
        h(NS.FactRow, { key: "d", label: "Your data", value: this.right("Kept") }),
      ]),
      h("div", { key: "reasons", role: "radiogroup", "aria-label": "Why are you leaving", style: { display: "flex", flexDirection: "column", gap: "var(--sp-2)" } },
        ["Too expensive", "Missing something I need", "Moving to another tool", "Business is pausing", "Something else"].map((r) =>
          h(NS.Radio, { key: r, name: "reason", value: r, label: r, checked: false, onChange: this.noop }))),
    ]);
    return { sheet: { open: true, onClose: this.noop, desktop: "modal", inset: true, size: "auto", density: "expressive", zIndex: 60, showClose: true,
      title: "Cancel subscription", subtitle: "Why are you leaving? Optional.", footer: footer }, body: body };
  }
  invoiceList() {
    /* 24 monthly cycles, Sept 2026 back to Oct 2024; the newest is the failed charge. */
    const seq = ["2026-0902", "2026-0874", "2026-0851", "2026-0822", "2026-0790", "2026-0761", "2026-0733", "2026-0702", "2026-0671",
      "2025-1188", "2025-1094", "2025-1003", "2025-0921", "2025-0846", "2025-0770", "2025-0698", "2025-0627", "2025-0559", "2025-0490", "2025-0431", "2025-0372",
      "2024-0988", "2024-0905", "2024-0822"];
    return seq.map((s, i) => {
      const d = new Date(Date.UTC(2026, 8 - i, 1));
      const failed = i === 0;
      return { key: s, iso: d.toISOString().slice(0, 10), number: "HG-INV-" + s, amount: CYCLE_WITH_GST, state: failed ? "Failed" : "Paid", tone: failed ? "danger" : "success" };
    });
  }
  listHead(query, counts) {
    const h = React.createElement; const NS = this.NS;
    return h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--sp-3)" } }, [
      h(NS.SearchField, { key: "find", ariaLabel: "Find in this list", placeholder: "Find in this list", value: query || "", onChange: this.noop, onClear: query ? this.noop : undefined, density: "expressive" }),
      h(NS.FilterChips, { key: "chips", label: "Invoice state", value: "all", onChange: this.noop, scroll: true,
        options: [{ value: "all", label: "All" }, { value: "paid", label: "Paid" }, { value: "failed", label: "Failed" }], counts: counts }),
    ]);
  }
  invoicesSheet(noMatch) {
    const h = React.createElement; const NS = this.NS;
    const list = this.invoiceList();
    const head = noMatch ? this.listHead("2023", { all: 0, paid: 0, failed: 0 }) : this.listHead("", { all: 24, paid: 23, failed: 1 });
    const body = noMatch
      ? h(NS.Block, { flat: true, density: "expressive", style: { padding: 0 }, read: { kind: "empty" }, emptyTitle: "No invoice matches 2023", emptyMessage: "Your invoices start in Oct 2024.", emptyAction: h(NS.Button, { variant: "secondary", size: "md", onClick: this.noop }, "Clear search") })
      : h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--tile-gap)" } },
          list.map((r) => h(NS.ListRow, Object.assign({ key: r.key }, this.invoiceRow(r.amount, r.iso, r.state, r.tone, r.number))))
            .concat([h(NS.Provenance, { key: "prov", tier: "unmarked", source: BOOK_LIST + " · 18% GST", size: 12 })]));
    return { sheet: { open: true, onClose: this.noop, inset: true, size: "full", density: "expressive", zIndex: 60, showClose: true,
      title: "All invoices", sheetProps: { meta: head } }, body: body };
  }
  remindersItems() {
    const F = this.F;
    const it = (id, label, date, desc, status) => ({ id: id, label: label, meta: F.date(date), description: desc, status: status || "done" });
    return [
      it("m4", "Monthly reminder", "2027-02-16", "Month 4 · next", "upcoming"),
      it("m3", "Monthly reminder", "2027-01-16", "Month 3", "current"),
      it("m2", "Monthly reminder", "2026-12-16", "Month 2"),
      it("m1", "Monthly reminder", "2026-11-16", "Month 1"),
      it("w4", "Weekly reminder", "2026-10-16", "Week 4 of 4"),
      it("w3", "Weekly reminder", "2026-10-09", "Week 3 of 4"),
      it("w2", "Weekly reminder", "2026-10-02", "Week 2 of 4"),
      it("w1", "Weekly reminder", "2026-09-25", "Week 1 of 4"),
      it("d7", "Account halted", "2026-09-18", "Day 7"),
      it("d6", "Final warning, with a pay link", "2026-09-17", "Day 6"),
      it("d4", "Voice, AI detections and invites paused", "2026-09-15", "Day 4"),
      it("d2", "Reminder", "2026-09-13", "Day 2"),
      it("d0", "Payment failed", FAILED_ON, "Day 0"),
    ];
  }
  historyItems() {
    const F = this.F;
    const it = (label, date, why, status) => ({ id: label + date, label: label, meta: F.date(date), description: why, status: status || "done" });
    return [
      it("Past due", FAILED_ON, "UPI AutoPay charge for Sept failed", "current"),
      it("Active", "2024-10-01", "Trial converted to Growth, monthly", "done"),
      it("Trial", "2024-09-17", "Signed up · 14 days", "done"),
    ];
  }
  timelineSheet(title, items, size) {
    const h = React.createElement;
    return { sheet: { open: true, onClose: this.noop, inset: true, size: size || "full", density: "expressive", zIndex: 60, showClose: true, title: title },
      body: h(this.NS.Timeline, { density: "expressive", variant: "compact", items: items }) };
  }

  /* ---- 1536: the desktop shell — rail with the bell and the account at its foot, header with the company and the one search ---- */
  account() {
    return React.createElement(this.NS.AccountMenu, {
      name: "Mahesh Bhosale", triggerName: "Mahesh Bhosale — account, grievance contact and sign out", menuLabel: "Account",
      grievanceLabel: "Grievance officer", signOutLabel: "Sign out", onGrievance: this.noop, onSignOut: this.noop, align: "start",
    });
  }
  rail() {
    const h = React.createElement; const D = this.NS.DESTINATION_GLYPH;
    const g = (name, filled) => h(this.NS.ShellGlyph, { name: name, size: "lg", filled: !!filled, tone: filled ? "primary" : "secondary" });
    return h(this.NS.AppRail, {
      label: "Main", value: "more", onChange: this.noop,
      items: [
        { key: "home", label: "Home", icon: g(D.home), activeIcon: g(D.home, true) },
        { key: "leads", label: "Leads", icon: g(D.leads), activeIcon: g(D.leads, true) },
        { key: "projects", label: "Projects", icon: g(D.projects), activeIcon: g(D.projects, true) },
        { key: "more", label: "More", icon: g(D.more), activeIcon: g(D.more, true) },
      ],
      footer: [{ key: "notifications", label: "Notifications", icon: g("bell"), onClick: this.noop }],
      avatar: this.account(),
    });
  }
  header() {
    const h = React.createElement;
    return h(this.NS.AppHeader, {
      tenant: h("span", { style: { fontSize: "var(--fs-body-sm)", fontWeight: "var(--fw-bold)", color: "var(--text-primary)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, "Suryodaya Solar"),
      search: h(this.NS.SearchField, { density: "functional", placeholder: "Search leads, projects, invoices", value: "", onChange: this.noop }),
    });
  }
  /* SCR-SHELL-01's settings side list for an EPC Owner, Billing in view. */
  settingsList() {
    const H = (t) => ({ key: "h-" + t, heading: t, row: false, current: false });
    const R = (label, glyph, cur) => ({ key: label, heading: null, label: label, glyph: glyph, row: !cur, current: !!cur });
    return [R("Profile & preferences", "people"), H("Your team"), R("Team", "people"), R("Roles reference", "shield"),
      H("Your company"), R("Business profile", "building"), R("Branding", "palette"), R("Proposal template", "document"), R("Payment terms", "calendar-clock"),
      H("What you sell"), R("Catalog", "package"), H("Customer calls"), R("Agent & voice", "headset"),
      H("Money"), R("Collections", "wallet"), R("Billing", "credit-card", true), R("Usage", "gauge")];
  }

  /* The invoices table: every amount ends on the region's right edge, so Amount is the last column. */
  invoiceColumns() {
    const h = React.createElement;
    return [
      { key: "date", label: "Date", primary: true },
      { key: "what", label: "For" },
      { key: "state", label: "State", render: (r) => this.chip(r.state, r.tone) },
      { key: "pdf", label: "PDF", render: (r) => h(this.NS.IconButton, { label: "Invoice " + r.number + " as PDF", onClick: this.noop, variant: "ghost" }, this.glyph("document", "md")) },
      { key: "amount", label: "Amount", numeric: true, mono: true, align: "right", trailing: true },
    ];
  }
  tableRows(list, what) {
    return list.map((r) => ({ key: r.key, date: this.F.date(r.iso), what: what || "Growth · monthly", state: r.state, tone: r.tone, number: r.number, amount: this.money(r.amount) }));
  }
  pageTable(n, latestState, latestTone) {
    const list = this.invoiceList().slice(0, n);
    list[0] = Object.assign({}, list[0], { state: latestState || "Paid", tone: latestTone || "success" });
    return { read: { kind: "ready" }, caption: "Invoices · the latest " + (n === 3 ? "three" : "six") + " of 24", density: "comfortable", stackBelow: 400,
      rowKey: "key", columns: this.invoiceColumns(), rows: this.tableRows(list) };
  }
  panel(title, body, o) {
    const t = o || {};
    return { sheet: { open: true, onClose: this.noop, inset: true, modal: false, desktop: "panel", width: t.width || 440, density: "expressive", zIndex: 30, showClose: true,
      title: title, meta: t.meta, panelProps: { style: { transform: "translateX(0)", animation: "none" } } }, body: body, overlayTop: "var(--header-h)" };
  }
  invoicesPanel(noMatch) {
    const h = React.createElement; const NS = this.NS;
    const head = noMatch ? this.listHead("2023", { all: 0, paid: 0, failed: 0 }) : this.listHead("", { all: 24, paid: 23, failed: 1 });
    const body = noMatch
      ? h(NS.Block, { flat: true, density: "expressive", style: { padding: 0 }, read: { kind: "empty" }, emptyTitle: "No invoice matches 2023", emptyMessage: "Your invoices start in Oct 2024.", emptyAction: h(NS.Button, { variant: "secondary", size: "md", onClick: this.noop }, "Clear search") })
      : h(NS.DataTable, { read: { kind: "ready" }, caption: "All invoices · 24", density: "comfortable", stackBelow: 400, rowKey: "key",
          columns: this.invoiceColumns(), rows: this.tableRows(this.invoiceList()), provenance: { tier: "unmarked", source: BOOK_LIST + " · 18% GST" }, page: 0, pageSize: 24, rowCount: 24, onPageChange: this.noop });
    return this.panel("All invoices", body, { width: 720, meta: head });
  }

  deskFrame(o) {
    const base = this.frame(o);
    return Object.assign(base, {
      id: "m12-02-" + o.key, height: (o.height || 1000) + "px",
      table: o.table || this.pageTable(6),
      overlayTop: o.overlayTop || "var(--header-h)",
    });
  }
  deskSpecs() {
    const f = (o) => this.deskFrame(o);
    const pastDue = { strip: this.dayFourStrip(), needs: this.pastDueNeeds(), plan: this.standardPlan("Past due", "danger"),
      invoices: this.invoicesBlock({ latestState: "Failed", latestTone: "danger" }), table: this.pageTable(3, "Failed", "danger") };
    const halted = {
      strip: this.deadStrip("Account halted · the grace window closed"),
      needs: this.wayBack("Halted", this.dunDeriv(FAILED_ON)),
      plan: this.planBlock("Halted", "danger", this.planRows({ lapsed: GRACE_ENDS, lapsedLabel: "Halted since" }), { routes: [this.changeRoute()], acc: this.includesAcc(false) }),
      method: this.methodBlock({ ended: true }),
      invoices: this.invoicesBlock({ latestState: "Failed", latestTone: "danger" }), table: this.pageTable(3, "Failed", "danger"),
      cancel: null,
    };
    const history = this.panel("Plan history", React.createElement(this.NS.Timeline, { density: "expressive", variant: "compact", items: this.historyItems() }));
    const reminders = this.panel("Payment reminders", React.createElement(this.NS.Timeline, { density: "expressive", variant: "compact", items: this.remindersItems() }));
    const all = this.invoicesPanel(false);
    const none = this.invoicesPanel(true);
    const cancel = this.cancelSheet();
    return [
      f({ key: "d1", label: "D1 · 1536 · active · the whole page", screenLabel: "Billing — 1536, active", height: 1240 }),
      f(Object.assign({ key: "d2", label: "D2 · 1536 · past_due day 4 · Plan history open", screenLabel: "Billing — 1536, past due, plan history", sheet: history.sheet, sheetBody: history.body }, pastDue)),
      f(Object.assign({ key: "d3", label: "D3 · 1536 · All 24 invoices · full length", screenLabel: "Billing — 1536, all invoices", height: 2020, sheet: all.sheet, sheetBody: all.body }, pastDue)),
      f(Object.assign({ key: "d4", label: "D4 · 1536 · All invoices · no match", screenLabel: "Billing — 1536, all invoices, no match", sheet: none.sheet, sheetBody: none.body }, pastDue)),
      f(Object.assign({}, halted, { key: "d5", label: "D5 · 1536 · halted · Payment reminders open", screenLabel: "Billing — 1536, halted, payment reminders", sheet: reminders.sheet, sheetBody: reminders.body })),
      f({ key: "d6", label: "D6 · 1536 · Cancel · the reason dialog", screenLabel: "Billing — 1536, cancel reason", sheet: cancel.sheet, sheetBody: cancel.body, overlayTop: "0px" }),
    ];
  }

  renderVals() {
    const NS = this.state.ds;
    if (!NS) return { market: {}, frames: [], settings: [], noop: this.noop };
    if (this._vals) return this._vals;
    this.NS = NS;
    this.F = NS.IN_FORMAT;
    this._vals = {
      market: NS.MarketProvider && NS.IN_PACK ? { pack: NS.IN_PACK } : {},
      noop: this.noop, rail: this.rail(), header: this.header(), settings: this.settingsList(),
      frames: this.deskSpecs(),
    };
    return this._vals;
  }
}
