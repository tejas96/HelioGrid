<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1740,"height":7130}}'>
/* Every date is pinned and every control is a no-op. Product facts are the brief's rows: BM-11's
   names, BM-41's prices, caps and bundles, M12-52's 14-day trial, M12-06's two-phase grace, M12-47's
   7-day refund window, F1-28's 18% GST. Sample content is the billing screens' one story. */
const NEXT_BILL = "2026-10-01";
const FAILED_ON = "2026-09-11";
const GRACE_ENDS = "2026-09-18";
const EARLY_FAILED_ON = "2026-09-13";
const EARLY_PAUSE = "2026-09-17";
const EARLY_GRACE_ENDS = "2026-09-20";
const BOOK_LIST = "India price list · 1 Apr 2026";
const GROWTH = { name: "Growth", mo: 3999, design: "500 kW", proposals: 300, detections: 100, storage: "50 GB", voiceRate: 6, detRate: 10 };
const ENTERPRISE_MO = 24999;
const GST = 0.18;
const CYCLE_WITH_GST = GROWTH.mo * (1 + GST);
const ENTERPRISE_WITH_GST = ENTERPRISE_MO * (1 + GST);
const INVOICE = "HG-INV-2026-0902";
/* SCR-SHELL-06's dead-state rows, word for word: BM-32's always-works set is four items. */
const DEAD_PAUSED = "Creating or editing leads, tasks, activities, surveys and designs · generating or sending proposals · marking won or lost · project updates · new uploads · voice calls · AI detections · teammate invites";
const DEAD_WORKS = "Reading · Export · Customer links · Billing — pay, upgrade, reactivate";

class Component extends DCLogic {
  state = { ds: null };
  noop = () => {};

  componentDidMount() {
    const ready = () => (typeof window === "undefined" ? null : window.HelioGridDesignSystem_c8aa43);
    if (ready()) { this.setState({ ds: ready() }); return; }
    this._poll = setInterval(() => { const ds = ready(); if (ds) { clearInterval(this._poll); this.setState({ ds }); } }, 60);
  }
  componentWillUnmount() { clearInterval(this._poll); }

  /* ---- marks and figures ---- */
  glyph(name, size, tone, style) { return React.createElement(this.NS.ShellGlyph, { name: name, size: size || "md", tone: tone || "secondary", style: style }); }
  /* A state mark the shell glyph set has no shape for — pause, tick, clock, rupee — sized through Icon. */
  stateMark(kind) {
    const h = React.createElement;
    const P = (d) => h("path", { key: d, d: d });
    const shapes = {
      paused: [P("M10 5.5v13M14 5.5v13")],
      works: [P("m4.5 12.5 5 5 10-11")],
      until: [h("circle", { key: "c", cx: 12, cy: 12, r: 8.5 }), P("M12 7.5V12l3 2")],
      amount: [P("M7 5h10M7 9h10M15 5c0 4-3.5 4-8 4l8 10")],
    };
    const tone = { paused: "var(--warning-text)", works: "var(--success-text)", until: "var(--text-secondary)", amount: "var(--text-secondary)" };
    if (kind === "intact") return this.glyph("shield", "sm", "secondary", { color: "var(--success-text)" });
    return h(this.NS.Icon, { size: "sm", style: { color: tone[kind] } },
      h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.5, strokeLinecap: "round", strokeLinejoin: "round" }, shapes[kind]));
  }
  mono(text) { return React.createElement("span", { style: { fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums" } }, text); }
  /* Every value ends on the region's right edge (brief decision 3); money in mono. */
  right(node, mono) {
    return React.createElement("span", { style: Object.assign({ display: "block", textAlign: "right" }, mono ? { fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums" } : {}) }, node);
  }
  chip(word, tone) { return React.createElement(this.NS.StatusChip, { status: word.toLowerCase().replace(/\s+/g, "-"), label: word, tone: tone, density: "expressive" }); }
  money(n) { return this.F.money(n, { fractionDigits: 2 }); }
  pair(label) { return { label: label, density: "expressive", form: "pair", style: { gridTemplateColumns: "120px minmax(0,1fr)", maxWidth: "100%" } }; }
  derived() { return { tier: "unmarked", align: "right" }; }

  /* ---- SCR-SHELL-06's strip, reused: a title, then fact rows of one family (mark · word · value). ---- */
  strip(kind, title, rows) {
    const h = React.createElement;
    return {
      kind: kind, title: title,
      body: h(this.NS.FactRows, { label: title, density: "expressive", form: "lead" },
        rows.map((r) => h(this.NS.FactRow, { key: r[1], mark: this.stateMark(r[0]), label: r[1], value: r[2], provenance: r[3] || undefined }))),
    };
  }
  dayFourStrip() {
    return this.strip("dunning", "Payment failed · day 4 of the 7-day grace", [
      ["paused", "Paused", "Voice calls · AI detections · teammate invites"],
      ["works", "Still works", "Leads · surveys · designs · proposals · projects"],
      ["until", "Until", this.F.date(GRACE_ENDS)],
    ]);
  }

  /* ---- SCR-M12-04's Needs you row: the name with its chip under it, the figure on the right edge. ---- */
  needRow(key, name, chipWord, tone, value, prov) {
    const h = React.createElement;
    const label = chipWord
      ? h("span", { style: { display: "flex", flexDirection: "column", alignItems: "flex-start", gap: "var(--sp-2)", minWidth: 0 } }, [h("span", { key: "n" }, name), h("span", { key: "c" }, this.chip(chipWord, tone))])
      : name;
    return { key: key, node: h(this.NS.FactRows, { label: name, density: "expressive", form: "pair", style: { gridTemplateColumns: "minmax(0,1fr) max-content", maxWidth: "100%" } },
      h(this.NS.FactRow, { label: label, value: value ? this.right(value, /[₹]/.test(value)) : undefined, provenance: prov || undefined })) };
  }
  /* What the strip does not carry, in the strip's own row form: the data is intact. */
  dataKeptRow() {
    const h = React.createElement;
    return { key: "intact", node: h(this.NS.FactRows, { label: "Your data", density: "expressive", form: "lead" },
      h(this.NS.FactRow, { label: "Your data", value: "Every lead, design, proposal and project — kept", mark: this.stateMark("intact") })) };
  }
  needsBlock(title, rows, act, o) {
    const t = o || {};
    return {
      block: Object.assign({ density: "expressive", title: title }, t.badge ? { badge: this.chip(t.badge, t.tone || "danger") } : {}),
      rows: rows,
      act: act ? { variant: "primary", size: "lg", fullWidth: true, onClick: this.noop } : null,
      actLabel: act || "", actLine: t.line || null,
      deriv: t.deriv || null, scope: t.scope || null,
    };
  }
  /* The amount's working, under the figure: the invoice, the price, the tax, the day it was tried. */
  dunDeriv(failedOn) {
    return { summary: "How it is worked out", label: "The amount", parts: [
      { kind: "formula", label: "Amount", text: ["Invoice ", this.mono(INVOICE), " — Growth for the cycle from 1 Sept: ", this.mono(this.F.money(GROWTH.mo)), " + 18% GST = ", this.mono(this.money(CYCLE_WITH_GST)), "."] },
      { kind: "note", label: "Charged", text: "Attempted on " + this.F.date(failedOn) + ", which is day 0 of the 7-day grace." },
    ] };
  }

  /* ---- SCR-M12-03's Your plan block: three pairs and the state as its one chip. ---- */
  planBlock(chipWord, tone, rows, o) {
    const t = o || {};
    return {
      block: Object.assign({ density: "expressive", title: "Your plan", badge: this.chip(chipWord, tone) }, t.source ? { provenance: { source: t.source } } : {}),
      group: this.pair("Your plan"), rows: rows, hasRows: rows.length > 0,
      routes: t.routes || [], acc: t.acc === undefined ? null : t.acc,
    };
  }
  row(label, value, mono, prov) { return { key: label, label: label, value: this.right(value, mono), prov: prov || null }; }
  /* The date carries no tier; the amount under it carries its derived mark beside it (F8-01). Two
     lines by intent: one line does not fit the value column beside the 120px label track. */
  nextBill(label, date, amount) {
    const h = React.createElement;
    return { key: label, label: label, prov: null, value: h("span", { style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "var(--sp-0-5)" } }, [
      h("span", { key: "d" }, this.F.date(date)),
      h("span", { key: "a", style: { display: "inline-flex", alignItems: "baseline", gap: "var(--sp-2)" } }, [
        h(this.NS.Provenance, { key: "p", tier: "unmarked", inline: true, size: 12 }),
        h("span", { key: "m", style: { fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums" } }, this.money(amount)),
      ]),
    ]) };
  }
  planRows(o) {
    const t = o || {};
    const plan = this.row("Plan", t.plan || GROWTH.name);
    const price = this.priceRow(GROWTH.mo);
    if (t.trial) return [this.row("Plan", "Trial"), this.row("Days left", t.daysLeft), this.row("Ends", this.F.date(t.ends))];
    if (t.lapsed) return [plan, this.row(t.lapsedLabel, this.F.date(t.lapsed))];
    if (t.runsUntil) return [plan, price, this.row("Runs until", this.F.date(t.runsUntil))];
    return [plan, price, this.nextBill("Next bill", t.next || NEXT_BILL, t.nextAmount || CYCLE_WITH_GST)];
  }
  /* A row inside a region sits on the region's own edges, so its trailing figure ends on the right edge. */
  flush() { return { paddingLeft: 0, paddingRight: 0 }; }
  /* The price is money, so it is mono; the cycle and the tax ride it in the sans face. */
  priceRow(amount) { return this.row("Price", [this.mono(this.F.money(amount)), " / mo + GST"]); }
  changeRoute() { return { title: "Change plan", trailing: this.glyph("chevron-right"), onClick: this.noop, density: "functional", style: this.flush() }; }
  includesAcc(open, trial) {
    const h = React.createElement; const NS = this.NS; const F = this.F;
    const r = (l, v, mono) => h(NS.FactRow, { key: l, label: l, value: this.right(v, mono) });
    const content = h(NS.FactRows, this.pair("What my plan includes"), trial ? [
      r("Biggest design", "100 MW"), r("Proposals", "Not capped"), r("AI detections", "25"), r("Voice minutes", "15"),
      r("Storage", "5 GB"), r("Active projects", "Not capped"), r("Users", "Unlimited"),
    ] : [
      r("Biggest design", GROWTH.design), r("Proposals a month", F.number(GROWTH.proposals)), r("AI detections a month", F.number(GROWTH.detections)),
      r("Extra detections", F.money(GROWTH.detRate) + " each", true), r("Voice minutes", F.money(GROWTH.voiceRate) + " / min", true),
      r("Storage", GROWTH.storage), r("Active projects", "Unlimited"), r("Users", "Unlimited"),
    ]);
    return { density: "functional", value: open ? "includes" : null, onChange: this.noop, items: [{ key: "includes", title: "What my plan includes", content: content }] };
  }
  standardPlan(chipWord, tone, o) {
    const t = o || {};
    return this.planBlock(chipWord, tone, this.planRows(t), { source: BOOK_LIST, routes: [this.changeRoute()], acc: this.includesAcc(!!t.open, !!t.trial) });
  }

  /* ---- SCR-M12-04's meter row ---- */
  meter(label, value, limit) {
    const m = { label: label, value: value, limit: limit, density: "expressive" };
    if (limit === null) m.noLimitNote = null;
    return m;
  }
  usageBlock(meters, limitsSource) {
    const h = React.createElement; const NS = this.NS;
    const foot = h("div", { style: { display: "flex", flexDirection: "column", gap: "var(--sp-0-5)" } }, [
      h(NS.Provenance, { key: "u", source: "Actual usage", size: 12 }),
      h(NS.Provenance, { key: "p", source: "Limits and rates · " + (limitsSource || BOOK_LIST), size: 12 }),
    ]);
    return {
      block: { density: "expressive", title: "Usage this cycle", footer: foot },
      meters: meters,
      route: { title: "All usage", trailing: this.glyph("chevron-right"), onClick: this.noop, density: "functional", style: this.flush() },
    };
  }

  /* ---- the payment method as the gateway names it, never an instrument detail ---- */

      market: NS.MarketProvider && NS.IN_PACK ? { pack: NS.IN_PACK } : {},
      phoneChrome: { style: { background: "transparent" } },
      frames: this.frameSpecs(),
    };
    return this._vals;
  }
