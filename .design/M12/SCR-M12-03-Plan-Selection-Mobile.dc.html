<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1740,"height":5453}}'>
/* Every date is pinned so the board never moves: today is 15 Sept 2026, the cycle in force runs
   1–30 Sept, and the next bill is 1 Oct 2026. Every plan name, price, cap and bundle is BM-11 /
   BM-41 / M12-52, the tax F1-28's 18% GST. */
const TODAY = "2026-09-15";
const NEXT_BILL = "2026-10-01";
const TRIAL_ENDED = "2026-09-14";
const HALTED_SINCE = "2026-09-08";
const TRIAL_NEXT_BILL = "2026-10-15";

const GST = 0.18;
const GST_PCT = "18%";
const BOOK_LIST = "India price list · 1 Apr 2026";
const DAYS_IN_CYCLE = 30;
const DAYS_LEFT = 16;

const BOOK = {
  starter: { name: "Starter", mo: 1999, yr: 19990, design: "50 kW", proposals: 30, detections: 30, projects: 10, storage: "10 GB" },
  growth: { name: "Growth", mo: 3999, yr: 39990, design: "500 kW", proposals: 300, detections: 100, projects: null, storage: "50 GB" },
  pro: { name: "Pro", mo: 9999, yr: 99999, design: "5 MW", proposals: 1500, detections: 400, projects: null, storage: "250 GB" },
  enterprise: { name: "Enterprise", mo: 24999, yr: null, design: "100 MW", proposals: null, detections: "Custom", projects: null, storage: "Custom" },
};

/* M12-48's arithmetic, computed from the book's own rows so no figure can drift from another. */
const PRORATA = (BOOK.pro.mo - BOOK.growth.mo) * DAYS_LEFT / DAYS_IN_CYCLE;
const GST_TODAY = PRORATA * GST;
const TOTAL_TODAY = PRORATA + GST_TODAY;
const PRO_MONTH_WITH_GST = BOOK.pro.mo * (1 + GST);
const STARTER_MONTH_WITH_GST = BOOK.starter.mo * (1 + GST);
const GROWTH_MONTH_GST = BOOK.growth.mo * GST;
const GROWTH_MONTH_WITH_GST = BOOK.growth.mo * (1 + GST);
const GROWTH_YEAR_WITH_GST = BOOK.growth.yr * (1 + GST);

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.noop = () => {};
  }

  componentDidMount() {
    if (!this.loaded()) {
      this._poll = setInterval(() => {
        if (this.loaded()) { clearInterval(this._poll); this._poll = null; this.forceUpdate(); }
      }, 40);
    }
  }
  loaded() { return !!window.HelioGridDesignSystem_c8aa43; }
  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }
  ns() { return window.HelioGridDesignSystem_c8aa43 || {}; }

  g(NS, name, size, filled, tone) {
    return React.createElement(NS.ShellGlyph, { name: name, size: size || "lg", filled: !!filled, tone: tone });
  }

  money(text) {
    return React.createElement("span", { style: { fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums" } }, text);
  }

  rightMoney(text) {
    return React.createElement("span", { style: { display: "block", textAlign: "right" } }, this.money(text));
  }

  /* SCR-SHELL-06's row mark: 16px, sitting on the first line beside the word. */
  markGlyph(d, color) {
    return React.createElement("svg", {
      width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: color,
      strokeWidth: 1.5, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true",
      style: { flexShrink: 0, marginTop: "var(--sp-0-5)" },
    }, React.createElement("path", { d: d }));
  }

  /* F7-48: the EPC Owner's standing destinations, More in view — billing is reached from More. */
  navOwner(NS) {
    const D = NS.DESTINATION_GLYPH;
    return {
      value: "more", onChange: this.noop,
      items: [
        { key: "home", label: "Home", icon: this.g(NS, D.home), activeIcon: this.g(NS, D.home, "lg", true, "inverse") },
        { key: "leads", label: "Leads", icon: this.g(NS, D.leads), activeIcon: this.g(NS, D.leads, "lg", true, "inverse") },
        { key: "add", verb: true, label: "Add lead", icon: this.g(NS, "plus-circle"), onClick: this.noop },
        { key: "projects", label: "Projects", icon: this.g(NS, D.projects), activeIcon: this.g(NS, D.projects, "lg", true, "inverse") },
        { key: "more", label: "More", icon: this.g(NS, D.more), activeIcon: this.g(NS, D.more, "lg", true, "inverse") },
      ],
    };
  }

  /* F7-48: a Sales Executive's destinations — Leads and Proposals. */
  navSales(NS) {
    const D = NS.DESTINATION_GLYPH;
    return {
      value: "more", onChange: this.noop,
      items: [
        { key: "home", label: "Home", icon: this.g(NS, D.home), activeIcon: this.g(NS, D.home, "lg", true, "inverse") },
        { key: "leads", label: "Leads", icon: this.g(NS, D.leads), activeIcon: this.g(NS, D.leads, "lg", true, "inverse") },
        { key: "add", verb: true, label: "Add lead", icon: this.g(NS, "plus-circle"), onClick: this.noop },
        { key: "proposals", label: "Proposals", icon: this.g(NS, D.proposals), activeIcon: this.g(NS, D.proposals, "lg", true, "inverse") },
        { key: "more", label: "More", icon: this.g(NS, D.more), activeIcon: this.g(NS, D.more, "lg", true, "inverse") },
      ],
    };
  }

  /* A page opened from More: its way back and its title, then the round search and bell. */
  topBar(NS) {
    return {
      title: "Plans", sticky: false,
      leading: React.createElement(NS.ShellAction, { round: true, label: "Back to billing", onClick: this.noop, icon: this.g(NS, "chevron-left", "md", false, "primary") }),
      searchLabel: "Search", onSearchClick: this.noop,
      notificationsLabel: "Notifications",
    };
  }

  /* The plan card shared with SCR-M12-01: the name, the price as the card's headline figure in mono
     with tabular figures and its period beside it, then the three limits that differ most as ONE
     flowing line. */
  cardBody(NS, F, tier, cycle) {
    const t = BOOK[tier];
    const ent = tier === "enterprise";
    const yearly = cycle === "yearly" && !ent;
    const figure = React.createElement("span", { style: { display: "flex", alignItems: "baseline", gap: "var(--sp-2)", flexWrap: "wrap" } },
      ent ? React.createElement("span", { key: "from", style: { fontSize: "var(--fs-body-sm)", color: "var(--text-secondary)" } }, "From") : null,
      React.createElement("span", { key: "n", style: { fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums", fontSize: "var(--fs-h1)", lineHeight: "var(--lh-h1)", fontWeight: "var(--fw-bold)", color: "var(--text-primary)" } }, F.money(yearly ? t.yr : t.mo)),
      React.createElement("span", { key: "p", style: { fontSize: "var(--fs-body-sm)", color: "var(--text-secondary)" } }, yearly ? "a year" : "a month"));
    const limits = React.createElement(NS.FactRows, { label: t.name, density: "expressive", form: "lead" },
      React.createElement(NS.FactRow, { label: "Limits", values: [
        t.design,
        (t.proposals === null ? "Unlimited" : F.number(t.proposals)) + " proposals a month",
        (typeof t.detections === "number" ? F.number(t.detections) : t.detections) + " detections a month",
      ] }));
    return React.createElement("span", { style: { display: "flex", flexDirection: "column", gap: "var(--sp-3)" } }, figure, limits);
  }

  /* One card per sellable tier. `relations` draws Your plan / Upgrade / Downgrade for a paying
     tenant; a trial tenant has no plan to be on, up or down from (M12-52), so its cards carry none. */
  planCards(NS, F, o) {
    const opts = o || {};
    const relations = opts.relations !== false;
    const chip = (word) => React.createElement(NS.Chip, { density: "expressive" }, word);
    return {
      label: "Choose a plan", value: opts.value || null, onChange: this.noop,
      currentLabel: "Your plan", density: "expressive",
      options: [
        { value: "starter", title: BOOK.starter.name, marks: relations ? chip("Downgrade") : null, content: this.cardBody(NS, F, "starter", opts.cycle) },
        { value: "growth", title: BOOK.growth.name, current: relations, content: this.cardBody(NS, F, "growth", opts.cycle) },
        { value: "pro", title: BOOK.pro.name, marks: relations ? chip("Upgrade") : null, content: this.cardBody(NS, F, "pro", opts.cycle) },
      ],
    };
  }

  /* Enterprise is sales-assisted, never a checkout: a row under the cards, outside the radiogroup,
     its act a raised pill with its glyph. */
  enterprise(NS, F) {
    return {
      icon: this.g(NS, "building", "md", false, "secondary"),
      iconColor: "var(--text-secondary)",
      title: BOOK.enterprise.name,

      base({ id: "m12-03-s11b", label: "State 11 · checkout failed · the act", screenLabel: "Plan selection — checkout failed · the act (375)", offset: "-372px",
        strip: failedStrip, stripLine: "You can also pay with another card.", planBlock: trialBlock,
        planCards: this.planCards(NS, F, { relations: false }) }),
    ];

    return list.map((f) => Object.assign({}, f, {
      sheetSections: f.sheetSections ? f.sheetSections.map((sec) => Object.assign({}, sec, {
        plainRows: !!(sec.rows && !sec.banner),
      })) : null,
      isCards: f.plans === "cards",
      isLoading: f.plans === "loading",
      isError: f.plans === "error",
      isReadOnly: f.plans === "readonly",
      actOff: f.act === "off",
      actLive: f.act === "live",
      actScope: f.act === "scope",
    }));
  }

  renderVals() {
    const NS = this.ns();
    const ready = !!(NS.MarketProvider && NS.MobileTopBar && NS.PhoneScreen && NS.ShellGlyph && NS.ShellAction
      && NS.DESTINATION_GLYPH && NS.BottomNav && NS.Block && NS.Provenance && NS.FactRows && NS.FactRow
      && NS.FilterChips && NS.OptionCardGroup && NS.Chip && NS.Button && NS.ListRow && NS.Card
      && NS.CompareGrid && NS.StatusChip && NS.Explainer && NS.EditorSurface && NS.SheetActions
      && NS.MoneySummary && NS.Derivation && NS.LoadingBars && NS.Banner && NS.BannerAction && NS.ScopeNote);
    if (!ready) return { noop: this.noop, frames: [] };
    if (this._vals) return this._vals;

    const F = NS.MarketProvider.createFormat();
    this.chevronDown = this.g(NS, "caret-down", "md", false, "secondary");
    this.chevronUp = this.g(NS, "caret-up", "md", false, "secondary");
    this.chevronRight = this.g(NS, "chevron-right", "md", false, "secondary");

    this._vals = {
      noop: this.noop,
      phoneChrome: { style: { background: "transparent" } },
      frames: this.frames(NS, F),

      /* The region's one primary, off with its reason — which opens in the Explainer bubble. */
      actOff: {
        variant: "primary", size: "lg", fullWidth: true, disabled: true,
        disabledReason: "Pick a plan to see what changes and what you pay.",
        onClick: this.noop,
      },
      actLive: { variant: "primary", size: "lg", fullWidth: true, onClick: this.noop },

      /* F8-01: a price the list publishes carries no tier; the region names the list and its date. */
      bookSource: { source: BOOK_LIST, size: 12 },

      compareWith: {
        label: "Compare with", value: "pro", onChange: this.noop,
        options: [{ value: "starter", label: "Starter" }, { value: "pro", label: "Pro" }, { value: "enterprise", label: "Enterprise" }],
      },

      loadingPlans: { label: "Loading the plans", bars: ["panel", "panel", "panel"] },
      errorBlock: {
        density: "expressive", read: { kind: "failed", retry: this.noop },
        title: "Choose a plan",
        errorTitle: "Couldn't load the plans",
        errorMessage: "The price list didn't answer — try again.",
      },

      /* Not the Owner: every plan and which one is yours, no price and no act. */
      readOnlyCards: [
        { key: "starter", name: "Starter", word: "Downgrade" },
        { key: "growth", name: "Growth", word: "Your plan" },
        { key: "pro", name: "Pro", word: "Upgrade" },
        { key: "enterprise", name: "Enterprise", word: "Annual contract" },
      ],
      scopeNote: { holder: "Mahesh Bhosale (owner)", acts: ["change this plan"], variant: "line", size: 13 },
    };
    return this._vals;
  }
}
</script>
