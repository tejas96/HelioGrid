          ? R("voice", M("voice", { label: W.voice, value: u.voiceMin, unit: "min", limit: c.voiceCap }), null, this.ledgerBtn(W.voice))
          : R("voice", M("voice", { label: W.voice, value: u.voiceMin, unit: "min", limit: null, note: F.money(c.voiceRate) + " a minute" }),
              [soFar("s", voiceSoFar)].filter(Boolean), this.ledgerBtn(W.voice)),
        R("storage", M("storage", { label: W.storage, value: u.storageGB, limit: c.storageGB, unit: "GB", period: "As of " + F.date(GAUGE_AT) + ", " + GAUGE_TIME }), null, this.ledgerBtn(W.storage)),
        R("otp", M("otp", { label: W.otp, value: u.otp, limit: null }), [
          { key: "c", label: W.charges, value: React.createElement(NS.StatusChip, { status: "not-billed", label: W.notBilled, tone: "neutral", density: "expressive" }) },
        ], this.ledgerBtn(W.otp)),
        R("seats", M("seats", { label: W.seats, value: u.seats, unit: "seats", limit: trial ? null : c.seats }), [
          resolved({ key: "m", label: W.seatMonths, value: this.fig(F.number(u.seatMonths)) }),
          trial ? null : { key: "r", label: W.rate, gap: gap },
        ].filter(Boolean), this.ledgerBtn(W.seats)),
        R("sends", M("sends", { label: W.sends, value: u.whatsapp + u.sms, unit: "sends", limit: trial ? null : c.sends }), [
          resolved({ key: "w", label: W.whatsapp, value: this.fig(F.number(u.whatsapp)) }),
          resolved({ key: "s", label: W.sms, value: this.fig(F.number(u.sms)) }),
          trial ? null : { key: "r", label: W.rate, gap: gap },
        ].filter(Boolean), this.ledgerBtn(W.sends)),
        /* ONE total row ends the region — only when something accrues, never on a trial. */
        !load && !trial && extraTotal > 0 ? R("extra", null, [
          { key: "t", label: W.extra, value: this.fig(F.money(extraTotal)), prov: Object.assign({ tier: "unmarked" }, right) },
          { key: "b", label: W.billsOn, value: this.fig(F.date(RESET)) },
        ]) : null,
      ].filter(Boolean),
    };

    return [limits, included];
  }

  /* The ledger behind one number — every detection event of the cycle. */
  ledgerRows(F) {
    const rows = [];
    const n = USED.detections;
    for (let i = 0; i < n; i++) {
      const day = 15 - Math.floor((i * 15) / n);
      const first = Math.ceil((15 - day) * n / 15);
      const slot = i - first;
      const mins = 18 * 60 - slot * 137 - ((i * 11) % 19);
      const hh = String(Math.floor(mins / 60)).padStart(2, "0");
      const mm = String(mins % 60).padStart(2, "0");
      const site = SITES[(i * 5) % SITES.length];
      const who = PEOPLE[(i * 3) % PEOPLE.length];
      const iso = "2026-09-" + String(day).padStart(2, "0");
      rows.push({
        key: "ev" + i,
        title: site[0] + " · " + site[1],
        subtitle: F.date(iso) + ", " + hh + ":" + mm + " · " + who,
        trailing: this.mono("1"),
        density: "functional",
        style: { background: "var(--fill)", boxShadow: "none", borderRadius: "var(--r-tile)" },
      });
    }
    return rows;
  }

  /* One sheet, three reads: the events, a failed read with its retry, and a cycle with none. */
  ledgerSheet(F, kind) {
    const base = {
      open: true, onClose: this.noop, desktop: "panel", inset: true, size: "full",
      density: "expressive", zIndex: 60, showClose: true,
      title: "AI detections",
      sheetProps: { style: { transform: "translateY(0)", animation: "none" } },
    };
    if (kind === "failed") return Object.assign(base, {
      subtitle: CYCLE, read: { kind: "failed", retry: this.noop },
      errorTitle: "Couldn't read these events",
    });
    if (kind === "empty") return Object.assign(base, {
      subtitle: CYCLE + " · 0 of " + F.number(GROWTH.detections), read: { kind: "empty" },
      emptyTitle: "No detections this cycle", emptyMessage: "Each detection you run is listed here.",
    });
    return Object.assign(base, {
      subtitle: CYCLE + " · " + F.number(USED.detections) + " of " + F.number(GROWTH.detections), read: { kind: "ready" },
    });
  }

  stChip(word, tone) {
    return { status: word.toLowerCase().replace(/\s+/g, "-"), label: word, tone: tone, density: "expressive" };
  }

  /* A Needs you row: the meter's name with its own chip, used of included, and ONE line. */
  needRow(NS, key, name, chipWord, tone, value, line) {
    const ink = tone === "danger" ? "var(--danger-text)" : tone === "info" ? "var(--info-text)" : "var(--warning-text)";
    return {
      key: key,
      label: React.createElement("span", { style: { display: "flex", flexDirection: "column", alignItems: "flex-start", gap: "var(--sp-2)", minWidth: 0 } }, [
        React.createElement("span", { key: "n" }, name),
        React.createElement(NS.StatusChip, { key: "c", status: chipWord.toLowerCase().replace(/\s+/g, "-"), label: chipWord, tone: tone, density: "expressive" }),
      ]),
      value: value ? this.fig(value) : null,
      line: line ? this.line(line) : null, lineInk: ink,
      group: { label: name, density: "expressive", leadBelow: 200, style: { gridTemplateColumns: "minmax(0,1fr) max-content", maxWidth: "100%" } },
    };
  }

  needsCard() {
    return { density: "expressive", title: "Needs you" };
  }

  /* SCR-SHELL-06's cap strip, reused exactly: title, its rows, and Upgrade plan. */
  capStrip(NS, title, rows, tone) {
    const h = React.createElement;
    return {
      kind: "cap", tone: tone, title: title,

  errorBanner(NS) {

      kind: "state", title: "Couldn't read this cycle's usage",
      children: "Try again — this screen only ever shows the billed figures.",

      actionBelow: 400,

  }

      base({
        key: "c", id: "m12-04-c", offset: "-330px", label: "375 · AI detections events", screenLabel: "Usage — AI detections events (375)",

      }),
      base({
        key: "c2", id: "m12-04-c2", offset: "-330px", label: "375 · events, failed read", screenLabel: "Usage — events, failed read (375)",
        sheet: this.ledgerSheet(F, "failed"),

      base(Object.assign(empty(), {
        key: "c3", id: "m12-04-c3", label: "375 · events, none this cycle", screenLabel: "Usage — events, none this cycle (375)",
