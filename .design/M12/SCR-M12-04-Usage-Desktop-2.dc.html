      { id: "seats", meter: "Tracked seats", used: F.number(u.seats) + " seats", included: F.number(GROWTH.seats) + " seats", gap: "Not published yet" },
      { id: "seatmonths", meter: "Seat-months", used: F.number(u.seatMonths, { minimumFractionDigits: 1 }) },
      { id: "sends", meter: "Marketing sends", used: F.number(u.whatsapp + u.sms) + " sends", included: F.number(GROWTH.sends) + " sends", gap: "Not published yet" },
      { id: "whatsapp", meter: "WhatsApp sends", used: F.number(u.whatsapp) },
      { id: "sms", meter: "SMS sends", used: F.number(u.sms) },
    ];

    return [
      {
        key: "limits",
        block: { density: "functional", title: "Limits", footer: foot },
        table: {
          density: "compact", rowKey: "id", read: { kind: "ready" }, caption: "Every cap and ceiling on Growth · " + CYCLE,
          columns: [
            { key: "limit", label: "Limit", primary: true, strong: true, width: 280 },
            Object.assign({}, used),
            { key: "allowed", label: "Allowed", align: "right", width: 190 },
          ],
          rows: limitRows,
          /* A capped count and a ceiling have no ledger (brief decision 6); the signal row takes Bigger plans. */
          rowActions: (r) => (o.signal === r.id ? this.rowPlans(NS) : null),
        },
      },
      {
        key: "included",
        block: { density: "functional", title: "Included each month", footer: foot },
        table: {
          density: "compact", rowKey: "id", read: { kind: "ready" }, caption: "Every meter on Growth · " + CYCLE,
          columns: [
            {
              key: "meter", label: "Meter", primary: true, strong: true, width: 168,
              render: (r) => (r.chip
                ? React.createElement("span", { style: { display: "inline-flex", alignItems: "center", flexWrap: "wrap", rowGap: "var(--sp-1)" } }, [
                    React.createElement("span", { key: "n" }, r.meter),
                    React.createElement(NS.StatusChip, { key: "c", status: "not-billed", label: r.chip, tone: "neutral", density: "expressive", style: { marginLeft: "var(--sp-2)", verticalAlign: "middle" } }),
                  ])
                : r.meter),
              rowLabel: (r) => r.meter,
            },
            Object.assign({}, used, {
              width: 118,
              render: (r) => (r.asOf
                ? React.createElement("span", { style: { display: "block", textAlign: "right" } }, [
                    React.createElement("span", { key: "v", style: { display: "block" } }, r.used),
                    React.createElement("span", { key: "a", style: { display: "block", marginTop: "var(--sp-0-5)", fontFamily: "var(--font-sans)", fontSize: "var(--fs-caption)", lineHeight: "var(--lh-caption)", fontWeight: "var(--fw-regular)", color: "var(--text-tertiary)" } }, r.asOf),
                  ])
                : r.used),
            }),
            { key: "included", label: "Included", align: "right", width: 140 },
            { key: "rate", label: "Rate", align: "right", width: 208, render: (r) => r.rate, gap: (r) => (r.gap ? gapCell(r.gap) : null) },
            { key: "charges", label: "Charges so far", numeric: true, width: 116, provenance: "unmarked" },
          ],
          rows: incRows,
          rowLabel: (r) => r.meter,
          rowActions: (r) => (r.id === "seatmonths" || r.id === "storage" ? null : this.rowLedger(NS, r.meter)),
        },
      },
    ];
  }

  stChip(word, tone) {
    return { status: word.toLowerCase().replace(/\s+/g, "-"), label: word, tone: tone, density: "expressive" };
  }

  needRow(NS, key, name, chipWord, tone, value, line) {
    const ink = tone === "danger" ? "var(--danger-text)" : tone === "info" ? "var(--info-text)" : "var(--warning-text)";
    /* ListRow's subtitle is one ellipsised line; the span lets the one line wrap whole. */
    return {
      key: key,
      row: {
        title: name, density: "expressive",
        marks: React.createElement(NS.StatusChip, { status: chipWord.toLowerCase().replace(/\s+/g, "-"), label: chipWord, tone: tone, density: "expressive" }),
        trailing: value ? this.fig(value) : null,
        subtitle: line ? React.createElement("span", { style: { display: "block", whiteSpace: "normal", textWrap: "pretty", fontWeight: "var(--fw-medium)", color: ink } }, line) : null,
        style: { padding: 0, minHeight: 0, background: "transparent", boxShadow: "none", alignItems: "flex-start" },
      },
    };
  }

  /* SCR-SHELL-06's cap strip, reused exactly: title, its rows, and Upgrade plan. */
  capStrip(NS, title, rows, tone, act) {
    const h = React.createElement;
    return {
      kind: "cap", tone: tone, title: title,
      children: h(NS.FactRows, null, rows.map((r) => h(NS.FactRow, { key: r[0], label: r[1], value: r[2] }))),
      action: act || h(NS.BannerAction, { onClick: this.noop }, "Upgrade plan"),
    };
  }

  /* The meters' failed read — what failed, and Try again inside it (the one read state). */
  errorBanner(NS) {
    return { read: { kind: "failed", retry: this.noop }, errorTitle: "Couldn't read this cycle's usage", errorMessage: "Try again — this screen only ever shows the billed figures.", retryLabel: "Try again", loadingLabel: "Loading this cycle's usage", density: "expressive" };
  }

  /* The chip is the frame's state: this card holds the one status chip the 375 header row holds. */
  cycleCardSpec(NS, word, tone) {
    return {
      density: "expressive", title: "This cycle",
      badge: React.createElement(NS.StatusChip, this.stChip(word || "Past what's included", tone || "info")),
    };
  }

  /* The ledger behind one number — every voice call of the cycle. */
  ledgerRows(F) {
    const rows = [];
    const n = CALLS;
    for (let i = 0; i < n; i++) {
      const day = 15 - Math.floor((i * 15) / n);
      const first = Math.ceil((15 - day) * n / 15);
      const slot = i - first;
      const mins = 18 * 60 - slot * 137 - ((i * 11) % 19);
      const hh = String(Math.floor(mins / 60)).padStart(2, "0");
      const mm = String(mins % 60).padStart(2, "0");
      const site = SITES[(i * 5) % SITES.length];
      const who = PEOPLE[(i * 3) % PEOPLE.length];
      const iso = "2026-09-" + String(day).padStart(2, "0");
      rows.push({
        key: "ev" + i,
        title: site[0] + " · " + site[1],
        subtitle: F.date(iso) + ", " + hh + ":" + mm + " · " + who,
        trailing: this.mono(callMinutes(i) + " min"),
        density: "functional",
        style: { background: "var(--fill)", boxShadow: "none", borderRadius: "var(--r-tile)" },
      });
    }
    return rows;
  }

  /* One panel, three reads: the events, a failed read with its retry, and a cycle with none. */
  deskPanelSpec(F, kind) {
    const base = {
      open: true, onClose: this.noop, desktop: "panel", inset: true, side: "right", width: 504,
      density: "expressive", zIndex: 60, showClose: true,
      title: "Voice minutes",
      panelAbove: 0,
      panelProps: { style: { transform: "translateX(0)", animation: "none" } },
    };
    if (kind === "failed") return Object.assign(base, {
      subtitle: CYCLE, read: { kind: "failed", retry: this.noop },
      errorTitle: "Couldn't read these events",
    });
    if (kind === "empty") return Object.assign(base, {
      subtitle: CYCLE + " · 0 min", read: { kind: "empty" },
      emptyTitle: "No calls this cycle", emptyMessage: "Each call the voice agent makes is listed here.",
    });
    return Object.assign(base, {
      subtitle: CYCLE + " · " + F.number(USED.voiceMin) + " min", read: { kind: "ready" },
    });
  }

  frameSpecs(NS, F) {
    const owner = this.railSpec(NS);
    const soFar = this.fig(this.amount(F, USED.voiceMin * GROWTH.voiceRate));
    const base = (o) => Object.assign({
      rail: owner, panel: null, panelRows: null, banner: null, strip: null, scope: null, needs: null, needsMain: null, needsRows: null,
      cols: "minmax(0, 1fr) 300px", side: true, tablesAlign: "flex-start",
      tables: this.deskTables(NS, F), cycleCard: this.cycleCardSpec(NS), extraValue: soFar,
    }, o);

    const all = [
      base({ key: "d1", id: "m12-04-d1", label: "1536 · default", screenLabel: "Usage — default (1536)" }),
      base({
        key: "d2", id: "m12-04-d2", label: "1536 · voice minutes events", screenLabel: "Usage — voice minutes events (1536)",
        panel: this.deskPanelSpec(F, "ready"), panelRows: this.ledgerRows(F),
      }),
      base({
        key: "d2f", id: "m12-04-d2f", label: "1536 · events, failed read", screenLabel: "Usage — events, failed read (1536)",
        panel: this.deskPanelSpec(F, "failed"),
      }),
      base({
        key: "d2e", id: "m12-04-d2e", label: "1536 · events, none this cycle", screenLabel: "Usage — events, none this cycle (1536)",
        panel: this.deskPanelSpec(F, "empty"), tables: this.deskTables(NS, F, { used: ZERO }), extraValue: null,
        cycleCard: this.cycleCardSpec(NS, "Within plan", "success"),
      }),
      base({
        key: "d3", id: "m12-04-d3", label: "1536 · default, foot", screenLabel: "Usage — default, foot (1536)",
        tablesAlign: "flex-end",
      }),
      base({
        key: "d4", id: "m12-04-d4", label: "1536 · cap reached, grace", screenLabel: "Usage — cap reached, grace running (1536)",
        strip: this.capStrip(NS, "Proposals · 300 of 300 used this month · 7-day grace running", [
          ["works", "Still works", "New proposals · editing, duplicating and sharing existing proposals · reading · export"],
          ["pause", "New proposals pause", "22 Sept 2026"],
          ["reset", "Cycle resets", "1 Oct 2026"]], "warning"),
        tables: this.deskTables(NS, F, { used: { proposals: 300 }, signal: "proposals" }),
        cycleCard: this.cycleCardSpec(NS, "At a limit", "warning"),
        needs: { density: "expressive", title: "Needs you" },
        needsRows: [this.needRow(NS, "prop", "Proposals this month", "At the cap", "warning", "300 of 300", "Grace ends 22 Sept 2026 · reading, editing and export never stop.")],
      }),
      base({
        key: "d5", id: "m12-04-d5", label: "1536 · error", screenLabel: "Usage — error (1536)",
        tables: [], cols: "minmax(0, 1fr)", side: false, banner: this.errorBanner(NS),
      }),
      base({
        key: "d6", id: "m12-04-d6", label: "1536 · not the Owner", screenLabel: "Usage — not the Owner, read only (1536)",
        rail: this.railSpec(NS, "Priya Sharma"), tables: [], cols: "minmax(0, 1fr)", side: false,
        /* SCR-SHELL-06's not-the-Owner form: the rows stay, ScopeNote takes the act's place, no amount. */
        strip: this.capStrip(NS, "Proposals · 300 of 300 used · new proposals paused", [
          ["paused", "Paused", "New proposals"],
          ["works", "Still works", "Editing, duplicating and sharing existing proposals · reading · export · every other feature"],
          ["reset", "Cycle resets", "1 Oct 2026"]], "danger",
          React.createElement(NS.ScopeNote, { holder: "Mahesh Bhosale (owner)", acts: ["upgrade the plan"], variant: "line", size: 13 })),
        scope: { holder: "Mahesh Bhosale (owner)", title: "Only Mahesh Bhosale (owner) can see this cycle's usage.", variant: "panel" },
        needsMain: { density: "expressive", title: "Needs you" },
        needsRows: [this.needRow(NS, "prop", "Proposals this month", "Paused", "danger", null, null)],
      }),
    ];
    return all.filter((f) => FRAME_SET.indexOf(f.key) !== -1);
  }

  renderVals() {
    const NS = this.ns();
    const ready = !!(NS.MarketProvider && NS.AppShell && NS.AppRail && NS.AppHeader && NS.AccountMenu && NS.ShellGlyph && NS.SearchField
      && NS.Breadcrumb && NS.DataTable && NS.Block && NS.Provenance && NS.FactRows && NS.FactRow && NS.StatusChip && NS.ListRow
      && NS.IconButton && NS.Button && NS.EditorSurface && NS.Banner && NS.BannerAction && NS.ScopeNote);
    const base = { noop: this.noop, twelve: 12, yes: true };
    if (!ready) return base;
    const F = NS.MarketProvider.createFormat();
    const I = this.icons();
    return Object.assign(base, {
      header: this.deskHeader(NS),
      crumbs: this.crumbs(NS), settings: this.settingsList(),
      sideGroup: { label: "This cycle", density: "expressive", leadBelow: 200, style: { gridTemplateColumns: "minmax(0,1fr) max-content", maxWidth: "100%" } },
      cycleValue: this.fig(CYCLE),
      resetValue: this.fig(F.date(RESET)),
      derivedRight: { tier: "unmarked", align: "right", size: 12 },
      extraCard: { density: "expressive", title: "Extra charges" },
      plansRow: {
        icon: this.glyph(I.layers, 22), iconColor: "var(--text-secondary)",
        title: "Bigger plans", subtitle: "Pro · Enterprise",
        trailing: this.glyph(I.chevRight, 20), onClick: this.noop, density: "expressive",
        style: { background: "var(--fill)", boxShadow: "none", borderRadius: "var(--r-tile)" },
      },
      frames: this.frameSpecs(NS, F),
    });
  }
}
</script>
