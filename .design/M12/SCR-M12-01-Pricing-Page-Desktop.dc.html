<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1632,"height":2215}}'>
/* Product facts are the brief's, word for word: BM-11's four names; BM-41's India book, ex-GST;
   M12-52's 14-day trial. The two list dates are sample content (F1-25). A price-list figure carries
   no tier (F8-01): each region names the list once, as an unmarked source line.
   The grid: content column x=104 → 1,432 (1,328px). The plans region is 4 columns on --tile-gap;
   the foot row is 12 columns on --section-gap, the matrix spanning 8 and Compared with 4. */
const BOOK_LIST = "India price list · 1 Apr 2026";
const BENCH_LIST = "Reslink India price page · 12 Mar 2026";

const BOOK = {
  starter: { name: "Starter", mo: 1999, design: "50 kW", proposals: 30, projects: 10,
    voice: null, voiceRate: 6, storage: "10 GB", support: "supStarter" },
  growth: { name: "Growth", mo: 3999, design: "500 kW", proposals: 300, projects: null,
    voice: null, voiceRate: 6, storage: "50 GB", support: "supGrowth" },
  pro: { name: "Pro", mo: 9999, design: "5 MW", proposals: 1500, projects: null,
    voice: 400, voiceRate: 6, storage: "250 GB", support: "supPro" },
  enterprise: { name: "Enterprise", mo: 24999, design: "100 MW", proposals: null, projects: null,
    voice: "custom", voiceRate: "custom", storage: "custom",
    support: "supEnterprise" },
};
const ORDER = ["starter", "growth", "pro", "enterprise"];
const TRIAL = { design: "100 MW", proposals: "Not capped", voice: "15", storage: "5 GB" };
const BENCH = [
  { key: "r1", rung: "50 kW", ours: "Starter", ourYr: 19990, theirs: "Reslink Basic", theirYr: 60000 },
  { key: "r2", rung: "500 kW", ours: "Growth", ourYr: 39990, theirs: "Reslink Pro", theirYr: 85000 },
  { key: "r3", rung: "5 MW", ours: "Pro", ourYr: 99999, theirs: "Reslink Premium", theirYr: 120000 },
];
const MEASURE = 40;

const T = {
  langLabel: "Language", langNames: { en: "English", hi: "हिन्दी", mr: "मराठी" },
  title: "Plans and prices",
  claim: "Every feature is in every plan — others hold features back for higher plans.",
  includes: "What every plan includes",
  cycle: "Billing cycle", monthly: "Monthly", yearly: "Yearly", yearlyDeal: "12 months for the price of 10",
  design: "Biggest design", support: "Support",
  limitsLead: "Limits", proposalsWord: "proposals a month",
  propShort: "Proposals", voice: "Voice minutes", storage: "Storage",
  projects: "Active projects", users: "Users", unlimited: "Unlimited",
  annual: "Annual contract", talk: "Talk to sales",
  show: "Show", setLimits: "Limits", setIncluded: "Included", setCharges: "Extra charges",
  comparedWith: "Compared with", allPlans: "All four plans", duringTrial: "During the trial",
  perMo: " / mo", perYr: " / yr", from: "From", perMoWord: "a month",
  pos_starter: "For a home-rooftop team of 1 to 5 people.",
  pos_growth: "For 15 or more installs a month, or your first business sites.",
  pos_pro: "For business sites, with voice minutes included.",
  pos_enterprise: "For the largest designs and utility work.",
  min: "min", custom: "Custom", none: "None", notPublished: "Not published yet",
  supStarter: "In the app", supGrowth: "App and WhatsApp", supPro: "Priority, and an onboarding call", supEnterprise: "A named contact",
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.noop = () => {};
  }

  componentDidMount() {
    if (!this.loaded()) {
      this._poll = setInterval(() => {
        if (this.loaded()) { clearInterval(this._poll); this._poll = null; this.forceUpdate(); }
      }, 40);
    }
  }
  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }

  loaded() {
    const n = window.HelioGridDesignSystem_c8aa43;
    return !!(n && n.FactRows && n.FactRow && n.CompareGrid && n.NamedGap && n.Wordmark && n.MarketProvider
      && n.Card && n.Menu && n.Button);
  }

  ns() { return window.HelioGridDesignSystem_c8aa43 || {}; }

  glyph(spec, size) {
    return React.createElement("svg", {
      width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
      strokeWidth: 1.5, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true",
    }, spec.map((d, i) => React.createElement("path", { key: "g" + i, d: d })));
  }

  icons() {
    return {
      chevDown: ["m6 9.5 6 6 6-6"],
      chevUp: ["m6 14.5 6-6 6 6"],
      grid: ["M4 4.8h6.4v6.4H4zM13.6 4.8H20v6.4h-6.4zM4 12.8h6.4v6.4H4zM13.6 12.8H20v6.4h-6.4z"],
      spark: ["M12 4.5 13.6 9l4.5 1.6-4.5 1.6L12 16.7l-1.6-4.5L5.9 10.6 10.4 9z", "M18 16.5v3M16.5 18h3"],
    };
  }

  money(text) {
    return React.createElement("span", { style: { fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums" } }, text);
  }

  langMenu(NS) {
    return {
      label: T.langLabel, align: "end", selection: "single",
      trigger: React.createElement(NS.Button, { variant: "ghost", size: "sm" }, T.langNames.en),
      items: ["en", "hi", "mr"].map((code) => ({ key: code, label: T.langNames[code], selected: code === "en", onSelect: this.noop })),
    };
  }

  values(F, key) {
    const b = BOOK[key];
    const custom = (v) => v === "custom";
    return {
      design: b.design,
      proposals: b.proposals === null ? T.unlimited : F.number(b.proposals) + T.perMo,
      projects: b.projects === null ? T.unlimited : F.number(b.projects),
      users: T.unlimited,
      voice: b.voice === null ? T.none : (custom(b.voice) ? T.custom : F.number(b.voice) + T.perMo),
      voiceRate: custom(b.voiceRate) ? T.custom : F.money(b.voiceRate) + " / " + T.min,
      storage: custom(b.storage) ? T.custom : b.storage,
    };
  }

  planCard(F, key) {
    const b = BOOK[key];
    const ent = key === "enterprise";
    const proposals = b.proposals === null ? T.unlimited : F.number(b.proposals);
    return {
      key: key,
      name: b.name,
      footChip: ent ? T.annual : null,
      lead: ent ? T.from : null,
      figure: F.money(b.mo),
      period: T.perMoWord,
      positioning: T["pos_" + key],
      group: { label: b.name, density: "expressive", form: "lead" },
      rows: [
        { key: "limits", label: T.limitsLead, values: [b.design, proposals + " " + T.proposalsWord] },
        { key: "support", label: T.support, values: [T[b.support]] },
      ],
      act: ent ? { variant: "secondary", size: "md", fullWidth: true, onClick: this.noop } : null,
    };
  }

  attributes(set) {
    if (set === "included") {
      return [
        { key: "voice", label: T.voice },
        { key: "storage", label: T.storage },
      ];
    }
    if (set === "overage") {
      return [
        { key: "voiceRate", label: T.voice, numeric: true, gapLabel: T.notPublished },
      ];
    }
    return [
      { key: "design", label: T.design },
      { key: "proposals", label: T.propShort },
      { key: "projects", label: T.projects },
      { key: "users", label: T.users },
    ];
  }

  optionValues(F, key, set) {
    const v = this.values(F, key);
    if (set === "included") return { voice: v.voice, storage: v.storage };
    if (set === "overage") return { voiceRate: v.voiceRate };
    return { design: v.design, proposals: v.proposals, projects: v.projects, users: v.users };
  }

  /* 200 + 4 × 169 = 876px: the matrix's 8 columns of the foot grid, so no option scrolls away. */
  matrix(F, set) {
    return {
      caption: T.allPlans,
      density: "functional", columnWidth: 169, labelWidth: 200,
      attributes: this.attributes(set),
      options: ORDER.map((k) => ({ key: k, name: BOOK[k].name, values: this.optionValues(F, k, set) })),
      provenance: { tier: "unmarked", source: BOOK_LIST },
    };
  }

  benchRows(F) {
    const rows = [];
    BENCH.forEach((r) => {
      rows.push({ key: r.key + "-ours", label: r.ours + " · " + r.rung, value: this.money(F.money(r.ourYr) + T.perYr) });
      rows.push({ key: r.key + "-theirs", label: r.theirs + " · " + r.rung, value: this.money(F.money(r.theirYr) + T.perYr) });
    });
    return rows;
  }

  chips(label, value, options) {
    return { label: label, value: value, onChange: this.noop, options: options };
  }

  openRow(icon, title, open) {
    const I = this.icons();
    return {
      icon: this.glyph(I[icon], 22), iconColor: "var(--text-secondary)", title: title,
      trailing: this.glyph(open ? I.chevUp : I.chevDown, 20), onClick: this.noop, density: "expressive",
    };
  }

  frameSpecs(F) {
    const frame = (o) => ({
      key: o.key, id: o.id, label: o.label, screenLabel: o.screenLabel, offset: o.offset,
      showSet: this.chips(T.show, "limits", [
        { value: "limits", label: T.setLimits },
        { value: "included", label: T.setIncluded },
        { value: "overage", label: T.setCharges },
      ]),
      grid: this.matrix(F, "limits"),
    });
    return [
      frame({ key: "d1", id: "m12-01-d1", offset: "0px", label: "D1 · 1536 · the top", screenLabel: "Pricing page — 1536, the top" }),
      frame({ key: "d2", id: "m12-01-d2", offset: "-700px", label: "D2 · 1536 · the foot", screenLabel: "Pricing page — 1536, the foot" }),
    ];
  }

  renderVals() {
    const NS = this.ns();
    const base = {
      noop: this.noop, t: T, wmDesktop: 30,
      bookLabel: { tier: "unmarked", source: BOOK_LIST, size: 12 },
      benchLabel: { tier: "unmarked", source: BENCH_LIST, size: 12 },
      includesRow: this.openRow("grid", T.includes, false),
      dealGroup: { density: "expressive", form: "lead" },
      benchGroup: { label: T.comparedWith, density: "expressive", form: "pair", measure: MEASURE },
      trialRow: this.openRow("spark", T.duringTrial, true),
      trialGroup: { label: T.duringTrial, density: "expressive", form: "pair", measure: MEASURE },
      trialRows: [
        { key: "design", label: T.design, value: TRIAL.design },
        { key: "proposals", label: T.propShort, value: TRIAL.proposals },
        { key: "voice", label: T.voice, value: TRIAL.voice },
        { key: "storage", label: T.storage, value: TRIAL.storage },
      ],
    };
    if (!this.loaded()) return base;
    const F = NS.MarketProvider.createFormat();
    return Object.assign(base, {
      langMenu: this.langMenu(NS),
      cycle: this.chips(T.cycle, "monthly", [{ value: "monthly", label: T.monthly }, { value: "yearly", label: T.yearly }]),
      cards: ORDER.map((k) => this.planCard(F, k)),
      bench: this.benchRows(F),
      frames: this.frameSpecs(F),
    });
  }
}
</script>
