const PRORATA = (BOOK.pro.mo - BOOK.growth.mo) * DAYS_LEFT / DAYS_IN_CYCLE;
/* The platform is not GST-registered: every figure is the list price alone (F1-29). */
const TOTAL_TODAY = PRORATA;

  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }

  }

  money(text) {

  }

  rightMoney(text) {
    return React.createElement("span", { style: { display: "block", textAlign: "right" } }, this.money(text));
  }

  /* F7-22 / F7-48: the persona's standing destinations, More in view; the bell and the account at
     the rail's foot. */
  rail(NS, who, second) {
    const D = NS.DESTINATION_GLYPH;
    const item = (key) => ({ key: key, label: key === "home" ? "Home" : key.charAt(0).toUpperCase() + key.slice(1), icon: this.g(NS, D[key]), activeIcon: this.g(NS, D[key], "lg", true, "primary") });

      footer: [{ key: "notifications", label: "Notifications", icon: this.g(NS, "bell"), badge: 7, onClick: this.noop }],

      search: React.createElement(NS.SearchField, { density: "functional", placeholder: "Search leads, projects, invoices", value: "", onChange: this.noop }),
    });

  /* SCR-SHELL-01's settings side list for an EPC Owner: a settings page at 1536 draws it, with no breadcrumb. */
  settingsList() {
    const H = (t) => ({ key: "h-" + t, heading: t, row: false, current: false });
    const R = (label, glyph, cur) => ({ key: label, heading: null, label: label, glyph: glyph, row: !cur, current: !!cur });
    return [R("Profile & preferences", "people"), H("Your team"), R("Team", "people"), R("Roles reference", "shield"), H("Your company"), R("Business profile", "building"), R("Branding", "palette"), R("Proposal template", "document"), R("Payment terms", "calendar-clock"), H("What you sell"), R("Catalog", "package"), H("Customer calls"), R("Agent & voice", "headset"), H("Money"), R("Collections", "wallet"), R("Billing", "credit-card", true), R("Usage", "gauge")];
  }

    const ent = tier === "enterprise";
    const figure = React.createElement("span", { style: { display: "flex", alignItems: "baseline", gap: "var(--sp-2)", flexWrap: "wrap" } },

        label: "About reading and exporting", title: "Reading and exporting",
        placement: "bottom", inset: true,
        pages: "Reading and exporting your work never stop, whatever happens to a payment.",
      }) : null,
    };
  }

  /* The review panel: the same groups, rows and words as the 375 sheet. */
  panelSections(F) {
    const m = (n) => this.money(F.money(n, { fractionDigits: 2 }));
    return [
      {
        key: "changes", overline: "What changes", group: { label: "What changes", density: "expressive", form: "lead" },
        rows: [
          { key: "d", label: "Biggest design", value: "500 kW → 5 MW" },
          { key: "p", label: "Proposals", value: "300 → 1,500 a month" },
          { key: "s", label: "Storage", value: "50 GB → 250 GB" },
          { key: "v", label: "Voice minutes", value: "Per minute → 400 a month" },
          { key: "u", label: "Unchanged", value: "Active projects · Users" },
        ],
        prov: { source: BOOK_LIST, size: 12 },
      },
      {
        key: "pay",
        money: {
          overline: "What you pay today", surface: "screen", density: "expressive", payableLabel: "Total today",
          lines: [
            { key: "delta", label: "Part of this cycle · " + DAYS_LEFT + " of " + DAYS_IN_CYCLE + " days", amount: PRORATA },
          ],
          provenance: { tier: "unmarked", source: BOOK_LIST },
        },
        deriv: {
          open: false, summary: "How the part-cycle amount is worked out", label: "Part of this cycle",
          parts: [
            { kind: "formula", label: "Days", text: DAYS_LEFT + " of this cycle's " + DAYS_IN_CYCLE + " days remain on " + F.date(TODAY) + "." },
            { kind: "formula", label: "Difference", text: React.createElement("span", null, m(BOOK.pro.mo - BOOK.growth.mo), " a month between Growth's ", m(BOOK.growth.mo), " and Pro's ", m(BOOK.pro.mo), ".") },
          ],
        },
      },
      {
        key: "when", overline: "When it starts", group: { label: "When it starts", density: "expressive", form: "lead" },
        rows: [
          { key: "s", label: "Plan swaps", value: F.date(NEXT_BILL) },
          { key: "m", label: "From then, a month", value: this.rightMoney(F.money(BOOK.pro.mo, { fractionDigits: 2 })) },
        ],
      },
    ];
  }

  /* F7-21's switch: the act opens this side panel, as it opens the sheet at 375. Non-modal — the
     page beside it is its subject. It mounts in the slot below the header, so the shell stays
     reachable; the slot is wider than the 720px threshold, so EditorSurface picks the panel itself
     at its own default width. */
  panel(NS, F) {
    return {
      open: true, onClose: this.noop, modal: false, desktop: "panel", inset: true,
      density: "expressive", zIndex: 30, showClose: false, dismissible: false,
      title: "Review", subtitle: "Growth to Pro · monthly",
      panelProps: { style: { transform: "translateX(0)", animation: "none" } },
      footer: React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "var(--sp-2)" } },
        React.createElement(NS.SheetActions, { key: "row" },
          React.createElement(NS.Button, { onClick: this.noop, fullWidth: true }, React.createElement("span", null, "Pay ", this.money(F.money(TOTAL_TODAY, { fractionDigits: 2 }))))),
        React.createElement("span", {
          key: "line",
          style: { fontSize: "var(--fs-caption)", lineHeight: "var(--lh-caption)", color: "var(--text-secondary)", textAlign: "center", textWrap: "pretty" },
        }, "Paid on your provider's own page — new limits apply at once.")),
    };
  }

  frames(NS, F) {
    const OPEN_PAD = "calc(var(--sp-24) * 5 + var(--screen-pad-desktop))";
    const SHUT_PAD = "var(--screen-pad-desktop)";
    const owner = this.rail(NS, "Mahesh Bhosale", "projects");
    const priced = [
      { key: "plan", label: "Plan", value: "Growth" },
      { key: "price", label: "Price", value: this.money(F.money(BOOK.growth.mo) + " / mo") },
      { key: "bill", label: "Next bill", value: F.date(NEXT_BILL) },
    ];
    const base = (o) => Object.assign({
      offset: "0px", padRight: SHUT_PAD, rail: owner, sideNav: true, settings: this.settingsList(), picked: false, picking: true, readOnly: false,
      planBlock: this.planBlock(NS, true), planRows: priced,
      plans: this.plans(NS, F, null), act: this.act(false),
      compare: this.compare(F, 1060), compareShow: this.compareShow(true),
    }, o);
    return [
      base({ id: "m12-03-d1", label: "1536 · the default", screenLabel: "Plan selection — default (1536)" }),
      base({ id: "m12-03-d2", label: "1536 · Pro picked · the review panel", screenLabel: "Plan selection — upgrade review panel (1536)",
        picked: true, sideNav: false, padRight: OPEN_PAD, plans: this.plans(NS, F, "pro"), act: this.act(true), compare: this.compare(F, 920) }),
      base({ id: "m12-03-d3", label: "1536 · the foot · all four plans compared", screenLabel: "Plan selection — full matrix (1536)", offset: "-227px" }),
      base({ id: "m12-03-d4", label: "1536 · not the Owner · read only", screenLabel: "Plan selection — non-Owner, read only (1536)",
        rail: this.rail(NS, "Priya Sharma", "proposals"), picking: false, readOnly: true,
        planBlock: this.planBlock(NS, false), planRows: [priced[0], priced[2]],
        /* A Sales Executive's list holds one row, so she gets no side list (SCR-SHELL-01, F7-48);
           the content takes the freed 248 px column and its gap. */
        sideNav: false, compare: this.compare(F, 1340, false),
        compareShow: this.compareShow(false) }),
    ];
  }

  renderVals() {
    const NS = this.ns();
    const ready = !!(NS.MarketProvider && NS.AppShell && NS.AppRail && NS.AppHeader && NS.AccountMenu
      && NS.ShellGlyph && NS.DESTINATION_GLYPH && NS.SearchField && NS.Breadcrumb && NS.Block && NS.FactRows
      && NS.FactRow && NS.FilterChips && NS.OptionCardGroup && NS.Card && NS.Chip && NS.Button && NS.ScopeNote
      && NS.Provenance && NS.CompareGrid && NS.StatusChip && NS.Explainer && NS.EditorSurface && NS.SheetActions
      && NS.MoneySummary && NS.Derivation);
    if (!ready) return { noop: this.noop, frames: [] };
    if (this._vals) return this._vals;
    const F = NS.MarketProvider.createFormat();

    this._vals = {
      noop: this.noop,
      /* F1-07: a payment prints to the paisa, so the review's money block reads the pack's minor unit. */
      paiseMarket: { format: NS.MarketProvider.createFormat({ currencyFractionDigits: 2 }) },
      frames: this.frames(NS, F),
      header: this.header(NS),
      crumbs: this.crumbs(NS),
      cycleSelector: {
        label: "Billing cycle", value: "monthly", onChange: this.noop,
        options: [{ value: "monthly", label: "Monthly" }, { value: "yearly", label: "Yearly" }],
      },
      enterpriseBody: this.cardBody(NS, F, "enterprise"),
      talkToSales: { size: "sm", variant: "secondary", icon: this.g(NS, "phone", "sm", false, "primary"), onClick: this.noop },
      readOnlyCards: [
        { key: "starter", name: "Starter", word: "Downgrade" },
        { key: "growth", name: "Growth", word: "Your plan" },
        { key: "pro", name: "Pro", word: "Upgrade" },
        { key: "enterprise", name: "Enterprise", word: "Annual contract" },
      ],
      scopeNote: { holder: "Mahesh Bhosale (owner)", acts: ["change this plan"], variant: "line", size: 13 },
      bookSource: { source: BOOK_LIST, size: 12 },
      compareBlock: { density: "functional", flat: true, style: { padding: 0 }, title: "Compare all plans" },
      panel: this.panel(NS, F),
      panelSections: this.panelSections(F),
    };
    return this._vals;
  }
}
</script>
</body>
