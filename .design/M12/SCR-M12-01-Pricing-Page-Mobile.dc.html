      { key: "users", label: T.users, value: v.users },
      { key: "detections", label: T.detections, value: v.detections },
      { key: "extraDet", label: T.extraDet, value: v.detRate },
      { key: "voice", label: T.voice, value: v.voice },
      { key: "extraVoice", label: T.extraVoice, value: v.voiceRate },
      { key: "storage", label: T.storage, value: v.storage },
      { key: "support", label: T.support, value: v.support },
    ];
    /* A rate the book marks draft is never a figure on a public page: its row names the gap. */
    if (draft) {
      const i = rows.findIndex((r) => r.key === "extraDet");
      rows[i] = { key: "extraDet", label: T.extraDet, value: null, gap: { gap: T.notPublished, scale: "field" } };
    }
    return rows;
  }

  planCard(F, key, cycle, o) {
    const I = this.icons();
    const b = BOOK[key];
    const ent = key === "enterprise";
    return {
      key: key,
      name: b.name,
      footChip: ent ? T.annual : null,
      lead: ent ? T.from : null,
      figure: F.money(ent ? b.mo : (cycle === "yearly" ? b.yr : b.mo)),
      period: ent ? T.perMoWord : (cycle === "yearly" ? T.perYrWord : T.perMoWord),
      positioning: T["pos_" + key],
      group: { label: b.name, density: "expressive", form: o.open ? "pair" : "lead", measure: MEASURE },
      rows: o.open ? this.fullRows(F, key, o.draft) : this.shortRows(F, key),
      limitsRow: {
        title: T.allLimits,
        trailing: this.glyph(o.open ? I.chevUp : I.chevDown, 20),
        onClick: this.noop, density: "expressive",
      },
      act: ent ? { variant: "secondary", size: "md", fullWidth: true, onClick: this.noop } : null,
    };
  }

  cards(F, cycle, o) {
    return ORDER.map((k) => this.planCard(F, k, cycle, { open: o.open === k, draft: o.draft && o.open === k }));
  }

  attributes(set) {
    if (set === "included") {
      return [
        { key: "detections", label: T.detShort },
        { key: "voice", label: T.voice },
        { key: "storage", label: T.storage },
      ];
    }
    if (set === "overage") {
      return [
        { key: "detRate", label: T.detShort, numeric: true, gapLabel: T.notPublished },
        { key: "voiceRate", label: T.voice, numeric: true },
      ];
    }
    return [
      { key: "design", label: T.design },
      { key: "proposals", label: T.propShort },
      { key: "projects", label: T.projects },
      { key: "users", label: T.users },
    ];
  }

  optionValues(F, key, set) {
    const v = this.Vt(F, key);
    if (set === "included") return { detections: v.detections, voice: v.voice, storage: v.storage };
    if (set === "overage") return { detRate: v.detRate, voiceRate: v.voiceRate };
    return { design: v.design, proposals: v.proposals, projects: v.projects, users: v.users };
  }

  grid375(F, a, b, set) {
    return {
      caption: BOOK[a].name + " · " + BOOK[b].name,
      density: "functional", columnWidth: 110, labelWidth: 112,
      attributes: this.attributes(set),
      options: [a, b].map((k) => ({ key: k, name: BOOK[k].name, values: this.optionValues(F, k, set) })),
      provenance: { tier: "unmarked", source: BOOK_LIST },
    };
  }

  /* One group, so every benchmark figure sits on one value edge; the capacity rides in the label. */
  benchRows(F) {
    const rows = [];
    BENCH.forEach((r) => {
      rows.push({ key: r.key + "-ours", label: r.ours + " · " + r.rung, value: this.money(F.money(r.ourYr) + T.perYr) });
      rows.push({ key: r.key + "-theirs", label: r.theirs + " · " + r.rung, value: this.money(F.money(r.theirYr) + T.perYr) });
    });
    return rows;
  }

  chips(label, value, options) {
    return { label: label, value: value, onChange: this.noop, options: options };
  }

  planChips(label, value, leaveOut) {
    return this.chips(label, value, ORDER.filter((k) => k !== leaveOut).map((k) => ({ value: k, label: BOOK[k].name })));
  }

  setChips(value) {
    return this.chips(T.show, value, [
      { value: "limits", label: T.setLimits },
      { value: "included", label: T.setIncluded },
      { value: "overage", label: T.setCharges },
    ]);
  }

  openRow(icon, title, open) {
    const I = this.icons();
    return {
      icon: this.glyph(I[icon], 22), iconColor: "var(--text-secondary)", title: title,
      trailing: this.glyph(open ? I.chevUp : I.chevDown, 20), onClick: this.noop, density: "expressive",
    };
  }

  frame(F, o) {
    const cycle = o.cycle || "monthly";
    const a = o.a || "growth";
    const b = o.b || "pro";
    const set = o.set || "limits";
    const priced = !o.plansBlock;
    return {
      key: o.key, id: o.id, label: o.label, screenLabel: o.screenLabel, offset: o.offset || "0px",
      includesRow: this.openRow("grid", T.includes, !!o.includesOpen),
      includesOpen: !!o.includesOpen,
      showCycle: priced,
      cycle: this.chips(T.cycle, cycle, [{ value: "monthly", label: T.monthly }, { value: "yearly", label: T.yearly }]),
      cards: priced ? this.cards(F, cycle, { open: o.openLimits, draft: o.draft }) : null,
      plansBlock: o.plansBlock || null,
      bookFoot: priced,
      bookLabel: { tier: "unmarked", source: o.draft ? "Sample market price list · draft rate" : BOOK_LIST, size: 12 },
      compareRow: priced ? this.openRow("scales", T.compare, !!o.compareOpen) : null,
      compareOpen: !!o.compareOpen,
      pickA: this.planChips(T.planOne, a, null),
      pickB: this.planChips(T.planTwo, b, a),
      showSet: this.setChips(set),
      grid: this.grid375(F, a, b, set),
      benchmark: priced,
      trialRow: priced ? this.openRow("spark", T.duringTrial, !!o.trialOpen) : null,
      trialOpen: !!o.trialOpen,
      footer: priced,
    };
  }

  frameSpecs(F) {
    const NS = this.ns();
    const talkBtn = React.createElement(NS.Button, { variant: "primary", size: "md", onClick: this.noop }, T.talk);
    const read = (kind) => ({ density: "expressive", loadingLabel: T.loading, retryLabel: T.retry, read: kind });
    const f = (o) => this.frame(F, o);
    return [
      f({ key: "top", id: "m12-01-top", label: "1 · The page at rest · 375", screenLabel: "Pricing page — at rest (375)" }),
      f({ key: "foot", id: "m12-01-foot", offset: "-1264px", label: "2 · The same page at its foot · 375", screenLabel: "Pricing page — the foot (375)" }),
      f({ key: "includes", id: "m12-01-includes", includesOpen: true, label: "3 · What every plan includes, opened in place · 375", screenLabel: "Pricing page — what every plan includes (375)" }),
      f({ key: "limits", id: "m12-01-limits", openLimits: "growth", offset: "-623px", label: "4 · All limits, opened on one plan · 375", screenLabel: "Pricing page — all limits, Growth (375)" }),
      f({ key: "compare", id: "m12-01-compare", compareOpen: true, offset: "-1841px", label: "5 · Compare two plans, opened in place · 375", screenLabel: "Pricing page — compare two plans (375)" }),
      f({ key: "charges", id: "m12-01-charges", compareOpen: true, set: "overage", offset: "-1841px", label: "6 · The same comparison, showing extra charges · 375", screenLabel: "Pricing page — extra charges (375)" }),
      f({ key: "included", id: "m12-01-included", compareOpen: true, set: "included", offset: "-1841px", label: "7 · The same comparison, showing what is included · 375", screenLabel: "Pricing page — included (375)" }),
      f({ key: "trial", id: "m12-01-trial", trialOpen: true, offset: "-2110px", label: "8 · During the trial, opened in place · 375", screenLabel: "Pricing page — during the trial (375)" }),
      f({ key: "yearly", id: "m12-01-yearly", cycle: "yearly", label: "9 · Yearly · 375", screenLabel: "Pricing page — yearly (375)" }),
      f({ key: "loading", id: "m12-01-loading", label: "10 · Loading · 375", screenLabel: "Pricing page — loading (375)",
        plansBlock: read({ kind: "loading" }) }),
      f({ key: "empty", id: "m12-01-empty", label: "11 · No prices published for this market · 375", screenLabel: "Pricing page — no price list for this market (375)",
        plansBlock: Object.assign(read({ kind: "empty" }), { emptyTitle: T.emptyTitle, emptyMessage: "", emptyAction: talkBtn }) }),
      f({ key: "error", id: "m12-01-error", label: "12 · The price list failed · 375", screenLabel: "Pricing page — price list failed (375)",
        plansBlock: Object.assign(read({ kind: "failed", retry: this.noop }), { errorTitle: T.errorTitle, errorMessage: T.errorMsg }) }),
      f({ key: "draft", id: "m12-01-draft", openLimits: "growth", draft: true, offset: "-623px", label: "13 · A sample market, a rate not published yet · 375", screenLabel: "Pricing page — a sample market with a draft rate (375)" }),
    ];
  }

  renderVals() {
    const NS = this.ns();
    const base = {
      noop: this.noop, yes: true, t: T, wmMobile: 22,
      phoneChrome: { style: { background: "transparent" } },
      bookLabel: { tier: "unmarked", source: BOOK_LIST, size: 12 },
      benchLabel: { tier: "unmarked", source: BENCH_LIST, size: 12 },
      gstNote: { note: T.gst, size: 12 },
      includesGroup: { density: "expressive", form: "lead" },
      includesRows: [
        { key: "every", label: T.everyPlan, values: T.everyPlanItems },
        { key: "studio", label: T.studio, values: T.studioItems },
      ],
      dealGroup: { density: "expressive", form: "lead" },
      benchGroup: { label: T.comparedWith, density: "expressive", form: "pair", measure: MEASURE },
      trialGroup: { label: T.duringTrial, density: "expressive", form: "pair", measure: MEASURE },
      trialRows: [
        { key: "design", label: T.design, value: TRIAL.design },
        { key: "proposals", label: T.propShort, value: TRIAL.proposals },
        { key: "det", label: T.detShort, value: TRIAL.detections },
        { key: "voice", label: T.voice, value: TRIAL.voice },
        { key: "storage", label: T.storage, value: TRIAL.storage },
      ],
    };
    if (!this.loaded()) return base;
    const F = NS.MarketProvider.createFormat();
    return Object.assign(base, {
      langMenu: this.langMenu(NS),
      bench: this.benchRows(F),
      frames: this.frameSpecs(F),
    });
  }
}
</script>
</body>
</html>
