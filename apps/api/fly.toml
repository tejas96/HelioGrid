# heliogrid-api — bom primary, sin overflow (docs/14 Day 1–2; ADR-0018 one app per service)
app = "heliogrid-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "8084"

[http_service]
  internal_port = 8084
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
