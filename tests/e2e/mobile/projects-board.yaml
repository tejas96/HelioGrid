# Projects board (`SCR-M08-01`): the board opens at its address over the day's hero. The one project
# the company step marked won has nothing to do and waits on no one, so the hero says nothing needs
# the owner; below it every live project by stage. The project stands in the Won group with its days
# figure, today, and a tap on it opens its page at its next step.
appId: com.heliogrid.app
---
- openLink: heliogrid://projects
- extendedWaitUntil:
    visible: ${PROJECTS_ALL_CLEAR}
    timeout: 15000
# The groups follow the hero and the stage pill, so the row is brought to the middle.
- scrollUntilVisible:
    element: ${PROJECT_NAME}
    centerElement: true
    timeout: 15000
- assertVisible: ${STAGE_WON}
# The days figure under the Won group's head — the hero's own label sits above it.
- assertVisible:
    text: ${DAYS_TODAY}
    below: ${STAGE_WON}
- tapOn: ${PROJECT_NAME}
- extendedWaitUntil:
    visible: ${NEXT_MOVE_TITLE}
    timeout: 15000
