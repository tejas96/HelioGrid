# The shell: a member with a company is inside, a fresh trial's day count under the bar
# (`SCR-SHELL-06`), and the pill's More opens the settings list (`SCR-SHELL-01`).
appId: com.heliogrid.app
---
- extendedWaitUntil:
    visible: ${MORE}
    timeout: 30000
# A fresh trial's strip is the quiet day count under the bar, with no act (`SCR-SHELL-06`).
- extendedWaitUntil:
    visible: ${TRIAL_CHIP}
    timeout: 15000
# The owner's home is the owner dashboard (`SCR-M13-01`): its forecast says it starts with proposals.
# Setup's last door opened Leads, so the flow goes Home first.
- tapOn: ${HOME}
- scrollUntilVisible:
    element: ${FORECAST_GAP}
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: ${MORE}
