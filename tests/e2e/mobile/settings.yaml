# Settings: the list names the rows an owner may open. It ends at its top, since the pages' flows
# open the rows from top to bottom; Catalog, further down, is `catalog-settings.yaml`'s.
appId: com.heliogrid.app
---
- extendedWaitUntil:
    visible: ${SETTINGS_TITLE}
    timeout: 15000
- assertVisible: "(.*, )?${ROW_PROFILE}"
- assertVisible: ${ROW_TEAM}
- assertVisible: ${ROW_ROLES}
- assertVisible: ${ROW_BRANDING}
# The Proposals row above the profile card puts these two below a phone's fold.
- scrollUntilVisible:
    element: ${ROW_PROPOSAL_TEMPLATES}
    timeout: 15000
- scrollUntilVisible:
    element: ${ROW_PAYMENT_TERMS}
    timeout: 15000
# The owner's pill holds Leads and Projects (`F7-48`), so More offers the Proposals list first, the
# one landed list the owner reads that the pill has no slot for (`moreWorkLists`); it opens the list.
- scrollUntilVisible:
    element: ${PROPOSALS_TITLE}
    direction: UP
    timeout: 15000
    centerElement: true
- tapOn: ${PROPOSALS_TITLE}
- extendedWaitUntil:
    visible: ${NEW_PROPOSAL}
    timeout: 15000
- back
- extendedWaitUntil:
    visible: ${SETTINGS_TITLE}
    timeout: 15000
