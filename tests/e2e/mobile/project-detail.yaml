# Project detail (`SCR-M08-02`…`04`): the project the company step started opens at its address, as
# a notice or Mark won opens it, titled with its customer. The hero names the stage and the one next
# act; the act moves it to Material ordered and the toast's Undo takes it back. A waiting row's acts
# are spoken with their row: its Not needed asks why in a sheet; once sent, the whole checklist keeps
# the row with its reason and its way back, down to the row handover itself makes. The install
# steps' own page shows no crew yet, no way in written, and the first step to tick.
appId: com.heliogrid.app
---
- openLink: heliogrid://projects/${PROJECT_ID}
- extendedWaitUntil:
    visible: ${PROJECT_NAME}
    timeout: 15000
- assertVisible: ${STAGE_WON}
- assertVisible: ${NEXT_MOVE_TITLE}
# The hero's act is named for the stage it moves to; the journey below names it too, so the first —
# the hero's — is the one tapped. The toast's Undo lives four seconds, so it is tapped the moment it
# shows, and the toast that follows says the move was taken back.
# Neither tap is tried twice: a second tap where the act stood would press what replaced it.
- tapOn:
    text: ${MOVE_ACT}
    retryTapIfNoChange: false
- tapOn:
    text: ${PROJECT_UNDO}
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: ${MOVE_UNDONE}
    timeout: 15000
- extendedWaitUntil:
    visible: ${NEXT_MOVE_TITLE}
    timeout: 15000
# The first waiting row is the first a person fills; its Not needed speaks the row's name, so the
# tap finds that row's act and no other.
- scrollUntilVisible:
    element: ${NOT_NEEDED_ACT}
    centerElement: true
- tapOn: ${NOT_NEEDED_ACT}
- extendedWaitUntil:
    visible: ${NOT_NEEDED_LINE}
    timeout: 15000
- tapOn:
    text: "${REASON_LABEL}(, .*)?"
    index: 1
- waitForAnimationToEnd
- inputText: ${REASON}
# The reason is many lines, so Return writes a new one: the keyboard is put away instead.
- hideKeyboard
- tapOn: ${MARK_NOT_NEEDED}
- extendedWaitUntil:
    visible: ${ROW_NOT_NEEDED}
    timeout: 15000
- scrollUntilVisible:
    element: ${SEE_ALL_DOCUMENTS}
    centerElement: true
- tapOn: ${SEE_ALL_DOCUMENTS}
# Only the whole checklist shows a row that waits no more: its way back, spoken with the row, and
# the line under its name that says why.
- extendedWaitUntil:
    visible: ${NEEDED_AFTER_ALL}
    timeout: 15000
- assertVisible: ".*${REASON}"
- scrollUntilVisible:
    element: ${LAST_ROW}
    centerElement: true
- assertVisible: ${MADE_AT_HANDOVER}
# The install steps have their own page, which the hero opens once the material has left; at Won it
# is reached at its address, and read only — a tick here would move the project early.
- openLink: heliogrid://projects/${PROJECT_ID}/steps
- extendedWaitUntil:
    visible: ${NO_CREW}
    timeout: 15000
- assertVisible: ${INSTALL_STEPS}
- assertVisible: ${NO_ACCESS_NOTE}
- scrollUntilVisible:
    element: ${FIRST_STEP}
    centerElement: true
