# Proposal defaults: what every new proposal starts with — a focus screen opened from settings
# and closed back to it by its own back button.
appId: com.heliogrid.app
---
- runFlow:
    file: steps/open-setting.yaml
    env:
      ROW: ${ROW_PROPOSAL_TEMPLATES}
- assertVisible: "(.*, )?${ROW_PROPOSAL_TEMPLATES}"
- tapOn: ${BACK_TO_SETTINGS}
