# Site details (`SCR-M05-01`, T-M05-001a, T-M05-002b): the design's site opens at its address with the lead's
# address and state filled and no location yet, so *Start design* says why it is off; Coordinates takes the two numbers a rep types, the pin
# stands under the map, and *Start design* saves the site and opens the studio, where a roof is
# drawn and closed.
appId: com.heliogrid.app
---
- openLink: heliogrid://designs/${DESIGN_ID}/site
- extendedWaitUntil:
    visible: ${SITE_BY_COORDINATES}
    timeout: 15000
# The lead's own facts are filled: its address in the search field, and its state further down.
- assertVisible: ${SITE_LEAD_ADDRESS}
- scrollUntilVisible:
    element: ${SITE_LEAD_STATE}
    direction: DOWN
- scrollUntilVisible:
    element: ${SITE_BY_COORDINATES}
    direction: UP
    centerElement: true
- tapOn: ${SITE_BY_COORDINATES}
# A field is the SECOND element its label's words name: the label first, the field after it.
- tapOn:
    text: "${SITE_LATITUDE}(, .*)?"
    index: 1
- waitForAnimationToEnd
- inputText: ${SITE_LATITUDE_TYPED}
- tapOn:
    text: "${SITE_LONGITUDE}(, .*)?"
    index: 1
- waitForAnimationToEnd
- inputText: ${SITE_LONGITUDE_TYPED}
# Return reads the two numbers and closes the keyboard: while it is up, the next tap is spent on it.
- pressKey: Enter
- scrollUntilVisible:
    element: ".*${SITE_PIN}.*"
    direction: DOWN
- scrollUntilVisible:
    element: ${SITE_START}
    direction: DOWN
    centerElement: true
- tapOn: ${SITE_START}
# The studio (T-M05-002b): draw, three corners square to each other, the fourth is offered, and
# Close shape stands the roof, which then offers its 3D view.
- extendedWaitUntil:
    visible: '${DESIGN_DRAW}'
    timeout: 20000
- tapOn: '${DESIGN_DRAW}'
- tapOn:
    point: '30%,38%'
- tapOn:
    point: '70%,38%'
- tapOn:
    point: '70%,52%'
- extendedWaitUntil:
    visible: ${DESIGN_FOURTH_READY}
    timeout: 10000
- tapOn: ${DESIGN_CLOSE_SHAPE}
- extendedWaitUntil:
    visible: ${DESIGN_SEE_IN_3D}
    timeout: 10000
