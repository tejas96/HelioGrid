# Site details (`SCR-M05-01`, T-M05-001a): the design's site opens at its address with the lead's
# address and state filled and no location yet, so *Start design* says why it is off; Coordinates takes the two numbers a rep types, the pin
# stands under the map, and *Start design* saves the site and opens the design's studio.
appId: com.heliogrid.app
---
- openLink: heliogrid://designs/${DESIGN_ID}/site
- extendedWaitUntil:
    visible: ${SITE_BY_COORDINATES}
    timeout: 15000
# The lead's own facts are filled: its address in the search field, and its state further down.
- assertVisible: ${SITE_LEAD_ADDRESS}
- scrollUntilVisible:
    element: ${SITE_LEAD_STATE}
    direction: DOWN
- scrollUntilVisible:
    element: ${SITE_BY_COORDINATES}
    direction: UP
    centerElement: true
- tapOn: ${SITE_BY_COORDINATES}
# A field is the SECOND element its label's words name: the label first, the field after it.
- tapOn:
    text: "${SITE_LATITUDE}(, .*)?"
    index: 1
- waitForAnimationToEnd
- inputText: ${SITE_LATITUDE_TYPED}
- tapOn:
    text: "${SITE_LONGITUDE}(, .*)?"
    index: 1
- waitForAnimationToEnd
- inputText: ${SITE_LONGITUDE_TYPED}
# Return reads the two numbers and closes the keyboard: while it is up, the next tap is spent on it.
- pressKey: Enter
- scrollUntilVisible:
    element: ".*${SITE_PIN}.*"
    direction: DOWN
- scrollUntilVisible:
    element: ${SITE_START}
    direction: DOWN
    centerElement: true
- tapOn: ${SITE_START}
# The site is saved and has its place, so the studio's page opens in Site details' place: the web
# studio it shows is not served on this lane, so the flow reads only that Site details has gone.
- extendedWaitUntil:
    notVisible: ${SITE_START}
    timeout: 15000
- assertNotVisible: ${SITE_BY_COORDINATES}
# A site saved with no place would open the holding page instead: it is not here either.
- assertNotVisible: ${DESIGN_HOLDING}
