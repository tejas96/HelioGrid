# Leads list (`SCR-M02-03`, `M02-52`): the pill's Leads door opens the list under the shared list
# top — the summary with the open leads, the search with the order and the filters, the stage
# chips — over the owner's leads. The summary's dormant figure narrows the list to the quiet ones,
# none in a new company, so the page says nothing matches while the top stays; Clear filters
# brings every lead back, and a card opens its lead.
appId: com.heliogrid.app
---
- openLink: heliogrid://leads
- extendedWaitUntil:
    visible: ${LEADS_OPEN}
    timeout: 15000
- assertVisible: ${LEADS_SEARCH_HINT}
# The newest lead is first under the list top, so the card is scrolled to.
- scrollUntilVisible:
    element: ${LEAD_NAME}
    timeout: 15000
- scrollUntilVisible:
    element: ${DORMANT_FIGURE}
    direction: UP
    timeout: 15000
- tapOn: ${DORMANT_FIGURE}
- extendedWaitUntil:
    visible: ${LEADS_NO_MATCH}
    timeout: 15000
- assertNotVisible: ${LEAD_NAME}
- assertVisible: ${DORMANT_FIGURE}
- tapOn: ${CLEAR_FILTERS}
- scrollUntilVisible:
    element: ${LEAD_NAME}
    timeout: 15000
- tapOn: ${LEAD_NAME}
- extendedWaitUntil:
    visible: ${CALL}
    timeout: 15000
