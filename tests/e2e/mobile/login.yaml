# The door: a new number asks for its code and the code step opens. `run.sh` then reads the code
# the api sent and enters it with steps/enter-code.yaml — Maestro cannot read a file mid-flow.
appId: com.heliogrid.app
---
# The Google door sits under the number (`M01-02`): the "or", then Continue with Google, whose
# spoken name starts with its words. No flow presses it — no agent holds a Google password.
- extendedWaitUntil:
    visible: "${CONTINUE_WITH_GOOGLE}(\\..*)?"
    timeout: 15000
- assertVisible: ${OR}
# A field is the SECOND element its label's words name: the label comes first, the field after it,
# and iOS may append `, <value>` to a field's name.
- tapOn:
    text: "${MOBILE_NUMBER}(, .*)?"
    index: 1
# A key typed before the keyboard is up is lost, so the tap settles first. The column is centred
# (`SCR-M01-01`), so it rises as the keyboard opens: the field is tapped again where it came to rest.
- waitForAnimationToEnd
- tapOn:
    text: "${MOBILE_NUMBER}(, .*)?"
    index: 1
- waitForAnimationToEnd
- inputText: ${PHONE}
- tapOn: ${SEND_CODE}
- extendedWaitUntil:
    visible: ${ENTER_THE_CODE}
    timeout: 15000
# Android's back on the code step takes it back to the number, kept, as *Change number* does: the
# step is a state of the door, not a route, so the navigator would close the app. The first back
# may only close the keyboard. Sending again is safe: `run.sh` reads the newest code.
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - runFlow:
          when:
            visible: ${ENTER_THE_CODE}
          commands:
            - back
      - extendedWaitUntil:
          visible: ${SEND_CODE}
          timeout: 5000
      - tapOn: ${SEND_CODE}
      - extendedWaitUntil:
          visible: ${ENTER_THE_CODE}
          timeout: 15000
